---
test_name: health

strict: false

stages:
  - name: health
    request:
      url: "{tavern.env_vars.GXA_SYSTEM_BASE}/json/health"
      method: GET
      timeout: 60
    response:
      status_code: 200
      json:
        solr: UP
        db: UP

---
test_name: list_experiments

strict: false

stages:
  - name: list_experiments
    request:
      url: "{tavern.env_vars.GXA_SYSTEM_BASE}/json/experiments"
      method: GET
      timeout: 180
    response:
      status_code: 200
      save:
        $ext:
          function: helpers:save_accession

---
test_name: one_experiment

strict: false

stages:
  - name: one_experiment
    request:
      url: "{tavern.env_vars.GXA_SYSTEM_BASE}/json/experiments/{accession}"
      method: GET
      timeout: 600
    response:
      status_code: 200
      save:
        $ext:
          function: helpers:save_gene_id

---
test_name: search

strict: false

stages:
  - name: search
    request:
      url: "{tavern.env_vars.GXA_SYSTEM_BASE}/json/search/baseline_facets"
      method: GET
      timeout: 180
      params:
        geneQuery: "{gene_id}"
    response:
      status_code: 200
      verify_response_with:
        function: helpers:assert_search_facets

---
test_name: gene

strict: false

stages:
  - name: gene
    request:
      url: "{tavern.env_vars.GXA_SYSTEM_BASE}/json/bioentity-information/{gene_id}"
      method: GET
      timeout: 180
    response:
      status_code: 200
      verify_response_with:
        function: helpers:assert_bioentity
