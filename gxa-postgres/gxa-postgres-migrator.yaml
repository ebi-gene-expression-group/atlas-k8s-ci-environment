apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-postgres-migrator
  namespace: jenkins-gene-expression
spec:
  template:
    spec:
      containers:
        - name: {{ include "app.name" . }}-flyway
          image: quay.io/ebigxa/{{ include "app.name" . }}-flyway-migrator
          env:
            - name: FLYWAY_USER
              value: "atlasdev"
            - name: FLYWAY_PASSWORD
              value: "atlasdev"
            - name: FLYWAY_SCHEMAS
              value: "atlasdev"
            - name: FLYWAY_URL
              value: "jdbc:postgresql://{{ include "app.name" . }}-postgres-headless.jenkins-gene-expression.svc.cluster.local:5432/gxpgxadev"
      restartPolicy: Never
  backoffLimit: 4
