apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-postgres-migrator
  namespace: jenkins-gene-expression
spec:
  template:
    spec:
      containers:
        - name: {{ .Release.Name }}-flyway
          image: quay.io/ebigxa/gxa-flyway-migrator
          env:
            - name: FLYWAY_USER
              value: "atlasdev"
            - name: FLYWAY_PASSWORD
              value: "atlasdev"
            - name: FLYWAY_SCHEMAS
              value: "atlasdev"
            - name: FLYWAY_URL
              value: "jdbc:postgresql://gxa-postgres-headless.jenkins-gene-expression.svc.cluster.local:5432/gxpgxadev"
      restartPolicy: Never
  backoffLimit: 4
