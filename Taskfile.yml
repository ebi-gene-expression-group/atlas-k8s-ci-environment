# https://taskfile.dev
# Install: https://taskfile.dev/installation/
# Usage: `task` lists tasks; `task deploy RELEASE=scxa ENV=test`

version: "3"

silent: true

dotenv:
  - .env

vars:
  RELEASE: 
    sh: echo "${RELEASE:-gxa}"
  ENV: 
    sh: echo "${ENV:-test}"
  SUPPORTED_ENVS: test staging
  APP_VERSION: 37.6.47
  NAMESPACE: "{{.RELEASE}}-{{.ENV}}"
  ENV_VALUES: charts/{{.RELEASE}}/values-{{.ENV}}.yaml
  CHART_PATH: charts/{{.RELEASE}}
  WAR_FILE_DIR: charts/{{.RELEASE}}/war
  # Jenkins — set JENKINS_USER and JENKINS_TOKEN in .env
  JENKINS_URL:
    sh: echo "${JENKINS_URL:-http://45.88.80.151:30004/jenkins}"
  JENKINS_JOB: Loading_bulk_using_indexing_pipeline_slurm
  JENKINS_BIOENTITIES_JOB: H_bioentities_loading_pipeline_bulk_and_sc
  # WAR_FILE_NAME: override via .env or env var (default: $RELEASE.war)
  CURL_DEBUG_OPTS: "--progress-bar"
  NGINX_CACHE_PURGE_DIR: nginx-cache-purge
  NGINX_CACHE_PURGE_REGISTRY: dockerhub.ebi.ac.uk
  NGINX_CACHE_PURGE_IMAGE: dockerhub.ebi.ac.uk/ebi-gene-expression/atlas-web-bulk/nginx-cache-purge
  NGINX_CACHE_PURGE_TAG:
    sh: echo "${TAG:-1.29.5}"

tasks:
  default:
    desc: List all tasks with descriptions (same as task --list)
    silent: true
    cmds:
      - task --list

  init-k8s:
    desc: Switch kubectl context (K8S_CONTEXT from env or .env) and default namespace for this RELEASE/ENV
    cmds:
      - kubectx "${K8S_CONTEXT}"
      - kubectl config set-context --current --namespace={{.NAMESPACE}}

  deploy:
    desc: Deploy the Atlas web app Helm chart (gxa or scxa) via helm upgrade --install
    deps: [init-k8s]
    cmds:
      - |
        set -euo pipefail
        RELEASE="{{.RELEASE}}"
        ENV="{{.ENV}}"
        SUPPORTED="{{.SUPPORTED_ENVS}}"
        ENV_VALUES="{{.ENV_VALUES}}"
        if ! echo " $SUPPORTED " | grep -q " $ENV "; then
          if [ ! -f "$ENV_VALUES" ]; then
            echo "Error: unknown ENV '$ENV'. Use one of: $SUPPORTED, or add $ENV_VALUES"
            exit 1
          fi
        fi
        HELM_SET_ARGS=(--set "appVersion={{.APP_VERSION}}")
        HELM_SET_ARGS+=(--set "image.tag={{.APP_VERSION}}")
        if [ -n "${INGRESS_HOST_BASE:-}" ]; then
          HELM_SET_ARGS+=(--set "ingress.hostBase=${INGRESS_HOST_BASE}")
        fi
        if [ -n "${DOCKER_CONFIG_JSON:-}" ]; then
          DOCKER_CONFIG_JSON="${DOCKER_CONFIG_JSON//\"/}"
          HELM_SET_ARGS+=(--set-file "registrySecret.dockerconfigjson=${DOCKER_CONFIG_JSON}")
        fi
        SECRETS_FILE="charts/${RELEASE}/.secrets-${ENV}.yaml"
        if [ -f "$SECRETS_FILE" ]; then
          echo "Using secrets file: $SECRETS_FILE"
          HELM_SET_ARGS+=(-f "$SECRETS_FILE")
        fi
        HELM_DEBUG_FLAGS=()
        case "${DEBUG:-}" in
          1|true|yes)
            echo "Running Helm in DEBUG dry-run mode (DEBUG=${DEBUG:-})"
            HELM_DEBUG_FLAGS=(--debug --dry-run)
            ;;
        esac
        helm upgrade --install \
          "$RELEASE" \
          "charts/${RELEASE}" \
          --namespace "{{.NAMESPACE}}" \
          -f "$ENV_VALUES" \
          "${HELM_SET_ARGS[@]}" \
          "${HELM_DEBUG_FLAGS[@]}"

  deploy-test:
    desc: Deploy to TEST (same as deploy with ENV=test)
    cmds:
      - task: deploy
        vars:
          ENV: test

  uninstall:
    desc: Remove the Atlas web app Helm release from the namespace
    cmds:
      - helm uninstall "{{.RELEASE}}" --namespace "{{.NAMESPACE}}"

  workflow:
    desc: Standard workflow — deploy then print completion (uses current RELEASE/ENV)
    deps: [deploy]
    cmds:
      - echo "Workflow completed — deployed to {{.ENV}} (RELEASE={{.RELEASE}})."

  deploy-war:
    desc: Upload WAR via Tomcat manager API, restart deployment, smoke-check URLs (needs init-k8s context)
    deps: [init-k8s]
    cmds:
      - |
        set -euo pipefail
        RELEASE="{{.RELEASE}}"
        ENV="{{.ENV}}"
        NAMESPACE="{{.NAMESPACE}}"
        WAR_FILE_DIR="{{.WAR_FILE_DIR}}"
        WAR_FILE_NAME="${WAR_FILE_NAME:-{{.RELEASE}}.war}"
        CURL_DEBUG_OPTS="{{.CURL_DEBUG_OPTS}}"
        case "$RELEASE" in
          gxa) DEPLOY_CTX_PATH="/gxa" ;;
          scxa) DEPLOY_CTX_PATH="/gxa/sc" ;;
          *)
            echo "Error: unknown RELEASE '$RELEASE'. Use gxa or scxa."
            exit 1
            ;;
        esac
        NODE_HOSTNAME="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
        TOMCAT_PORT="$(kubectl get service "$RELEASE" --namespace "$NAMESPACE" -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || true)"
        TOMCAT_SERVER_URL="http://${NODE_HOSTNAME}:${TOMCAT_PORT}"
        echo "Deploying WAR using deploy context path: $DEPLOY_CTX_PATH"
        DEPLOYER_PASSWORD="$(kubectl get secret "${RELEASE}-secrets" --namespace "$NAMESPACE" \
          -o jsonpath='{.data.tomcat-users\.xml}' \
          | base64 -d \
          | yq -p=xml '.tomcat-users.user[] | select(.["+@username"] == "deployer") | .["+@password"]')"
        if [ -z "$DEPLOYER_PASSWORD" ]; then
          echo "ERROR: Failed to get deployer password"
          exit 1
        fi
        echo "Restarting deployment on k8s to apply new WAR..."
        kubectl rollout restart deployment "$RELEASE" --namespace "$NAMESPACE"
        echo "Waiting for deployment to complete..."
        kubectl rollout status deployment "$RELEASE" --namespace "$NAMESPACE" --timeout=300s
        echo "Deploying WAR to ${TOMCAT_SERVER_URL}..."
        curl --verbose \
          --user "deployer:${DEPLOYER_PASSWORD}" \
          --fail \
          --include \
          $CURL_DEBUG_OPTS \
          "${TOMCAT_SERVER_URL}/manager/text/deploy?path=${DEPLOY_CTX_PATH}&update=true" \
          --upload-file "${WAR_FILE_DIR}/${WAR_FILE_NAME}"
        echo "Listing deployed applications..."
        curl --user "deployer:${DEPLOYER_PASSWORD}" \
          --fail \
          $CURL_DEBUG_OPTS \
          "${TOMCAT_SERVER_URL}/manager/text/list"
        echo "Checking application homepage..."
        curl --fail \
          "${TOMCAT_SERVER_URL}${DEPLOY_CTX_PATH}" \
          --location \
          -O
        echo "Checking app health check endpoint..."
        curl --fail \
          "${TOMCAT_SERVER_URL}${DEPLOY_CTX_PATH}/json/health" \
          --location
        echo "Checking experiments page..."
        curl --fail \
          "${TOMCAT_SERVER_URL}${DEPLOY_CTX_PATH}/json/experiments" \
          --location \
          -O

  print-env:
    desc: Print current RELEASE and ENV (and related paths)
    cmds:
      - echo "ENV={{.ENV}} RELEASE={{.RELEASE}} NAMESPACE={{.NAMESPACE}} VALUES={{.ENV_VALUES}}"

  open-monitoring:
    desc: Open Grafana namespace pods dashboard for this namespace (EBI internal URL)
    cmds:
      - |
        open "https://grafana-hh-webadmin-35.wp-k8s.ebi.ac.uk/d/85a562078cdf77779eaa1add43ccec1e/kubernetes-compute-resources-namespace-pods?orgId=1&refresh=10s&var-datasource=default&var-cluster=&var-namespace={{.NAMESPACE}}"

  open-webapp:
    desc: Open the app in a browser via the GXA service NodePort
    deps: [init-k8s]
    cmds:
      - |
        set -euo pipefail
        RELEASE="{{.RELEASE}}"
        NAMESPACE="{{.NAMESPACE}}"
        case "$RELEASE" in
          gxa) CTX_PATH="/gxa" ;;
          scxa) CTX_PATH="/gxa/sc" ;;
          *) echo "Error: unknown RELEASE"; exit 1 ;;
        esac
        NODE_HOSTNAME="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
        SERVICE_PORT="$(kubectl get service "$RELEASE" --namespace "$NAMESPACE" \
          -o jsonpath='{.spec.ports[0].nodePort}')"
        URL="http://${NODE_HOSTNAME}:${SERVICE_PORT}${CTX_PATH}"
        echo "Opening $URL"
        open "$URL"

  gxa-print-urls:
    desc: Print GXA_SOURCE_JSON_URL, GXA_TARGET_JSON_URL, and TARGET_ENVIRONMENT from .env
    cmds:
      - |
        set -euo pipefail
        for var in GXA_SOURCE_JSON_URL GXA_TARGET_JSON_URL TARGET_ENVIRONMENT; do
          val="${!var:-}"
          if [ -z "$val" ]; then
            echo "ERROR: $var is not set (see .env.example)" >&2
            exit 1
          fi
          echo "$var=$val"
        done

  gxa-resolve-target-json-url:
    desc: Derive GXA_TARGET_JSON_URL from k8s ingress (RELEASE=gxa ENV=test). Compare with .env.
    deps: [init-k8s]
    cmds:
      - bash scripts/resolve-gxa-target-json-url.sh

  gxa-experiments-gap:
    desc: |
      Experiments on GXA_SOURCE_JSON_URL but not GXA_TARGET_JSON_URL (species on target only).
      Usage: task gxa-experiments-gap COUNT=10
      Optional: PER_SPECIES=3  COMMA_LIST=true (for piping to trigger-indexing)
    vars:
      COUNT: '{{default "0" .COUNT}}'
      PER_SPECIES: '{{default "0" .PER_SPECIES}}'
      COMMA_LIST: '{{default "false" .COMMA_LIST}}'
    cmds:
      - |
        set -euo pipefail
        ARGS=()
        [ "{{.COUNT}}" != "0" ] && ARGS+=(--count "{{.COUNT}}")
        [ "{{.PER_SPECIES}}" != "0" ] && ARGS+=(--per-species "{{.PER_SPECIES}}")
        [ "{{.COMMA_LIST}}" = "true" ] && ARGS+=(--comma-list)
        python3 scripts/gxa_experiments_gap.py "${ARGS[@]}"

  jenkins-params:
    desc: List parameters accepted by the indexing pipeline job
    cmds:
      - |
        curl -fsSL \
          --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
          "{{.JENKINS_URL}}/job/{{.JENKINS_JOB}}/api/json?tree=property\[parameterDefinitions\[name,type\]\]" \
          | jq

  bioentities-jenkins-params:
    desc: List parameters for H_bioentities_loading_pipeline_bulk_and_sc (from Jenkins config.xml)
    cmds:
      - |
        set -euo pipefail
        curl -fsSL --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
          "{{.JENKINS_URL}}/job/{{.JENKINS_BIOENTITIES_JOB}}/config.xml" \
          | python3 -c "
        import sys, xml.etree.ElementTree as ET
        root = ET.parse(sys.stdin)
        for d in root.findall('.//parameterDefinitions/*'):
            name = d.findtext('name') or d.tag
            desc = (d.findtext('description') or '').strip().replace('\n', ' ')[:120]
            default = d.findtext('defaultValue')
            choices = [c.text for c in d.findall('.//choices/a/string') if c.text]
            print(f'{name}')
            if desc: print(f'  description: {desc}')
            if default is not None: print(f'  default: {default}')
            if choices: print(f'  choices: {choices[:8]}' + (' ...' if len(choices) > 8 else ''))
            print()
        "

  gxa-prod-only-species:
    desc: |
      Species on GXA_SOURCE_JSON_URL but not on GXA_TARGET_JSON_URL, ranked by experiment count.
      Usage: task gxa-prod-only-species COUNT=10
    vars:
      COUNT: '{{default "10" .COUNT}}'
    cmds:
      - python3 scripts/gxa_prod_only_species.py --count "{{.COUNT}}"

  trigger-bioentities:
    desc: |
      Trigger H_bioentities_loading_pipeline_bulk_and_sc for one species.
      Usage: task trigger-bioentities SPECIES=zea_mays
      Optional: RESOURCE=gxa ENVIRONMENT=k8s_test TARGET=load_bioentities_only PREFIX=build_work
    vars:
      SPECIES: '{{.SPECIES}}'
      RESOURCE: '{{default "gxa" .RESOURCE}}'
      ENVIRONMENT: '{{default "k8s_test" .ENVIRONMENT}}'
      TARGET: '{{default "load_bioentities_only" .TARGET}}'
      FORCEALL: '{{default "false" .FORCEALL}}'
      GITLAB_SCR: '{{default "/hps/software/users/ma/fg_atlas/git/snakemake-codon-runs/" .GITLAB_SCR}}'
      PREFIX: '{{default "build_work" .PREFIX}}'
    preconditions:
      - sh: '[ -n "{{.SPECIES}}" ]'
        msg: "SPECIES is required. Usage: task trigger-bioentities SPECIES=zea_mays"
    cmds:
      - |
        set -euo pipefail
        echo "JOB={{.JENKINS_BIOENTITIES_JOB}}"
        echo "SPECIES={{.SPECIES}} RESOURCE={{.RESOURCE}} ENVIRONMENT={{.ENVIRONMENT}}"
        echo "TARGET={{.TARGET}} PREFIX={{.PREFIX}}"
        DATA_ARGS=()
        add_param() {
          local name="$1" value="$2"
          [ -n "$value" ] && DATA_ARGS+=(--data-urlencode "${name}=${value}")
        }
        add_param "SPECIES" "{{.SPECIES}}"
        add_param "RESOURCE" "{{.RESOURCE}}"
        add_param "ENVIRONMENT" "{{.ENVIRONMENT}}"
        add_param "TARGET" "{{.TARGET}}"
        add_param "FORCEALL" "{{.FORCEALL}}"
        add_param "GITLAB_SCR" "{{.GITLAB_SCR}}"
        add_param "PREFIX" "{{.PREFIX}}"
        RESPONSE=$(curl -si \
          --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
          -X POST \
          "{{.JENKINS_URL}}/job/{{.JENKINS_BIOENTITIES_JOB}}/buildWithParameters" \
          "${DATA_ARGS[@]}")
        echo "$RESPONSE"
        QUEUE_URL=$(echo "$RESPONSE" | grep -i "^location:" | tr -d '\r' | awk '{print $2}')
        if [ -n "$QUEUE_URL" ]; then
          echo ""
          echo "Queued at: $QUEUE_URL"
        fi

  trigger-bioentities-top:
    desc: |
      Load bioentities for top N prod-only species (not on GXA target) with valid Jenkins SPECIES slug.
      Usage: task trigger-bioentities-top COUNT=2
      Optional overrides: same as trigger-bioentities (PREFIX, ENVIRONMENT, ...)
    vars:
      COUNT: '{{default "2" .COUNT}}'
      RESOURCE: '{{default "gxa" .RESOURCE}}'
      ENVIRONMENT: '{{default "k8s_test" .ENVIRONMENT}}'
      TARGET: '{{default "load_bioentities_only" .TARGET}}'
      FORCEALL: '{{default "false" .FORCEALL}}'
      GITLAB_SCR: '{{default "/hps/software/users/ma/fg_atlas/git/snakemake-codon-runs/" .GITLAB_SCR}}'
      PREFIX: '{{default "build_work" .PREFIX}}'
    cmds:
      - |
        set -euo pipefail
        GXA_SOURCE_JSON_URL="${GXA_SOURCE_JSON_URL:-https://www.ebi.ac.uk/gxa/json/experiments}"
        GXA_TARGET_JSON_URL="${GXA_TARGET_JSON_URL:-}"
        if [ -z "$GXA_TARGET_JSON_URL" ]; then
          echo "ERROR: GXA_TARGET_JSON_URL is not set (see .env.example)" >&2
          exit 1
        fi
        export GXA_SOURCE_JSON_URL GXA_TARGET_JSON_URL
        SLUGS=$(python3 scripts/gxa_prod_only_species.py --count "{{.COUNT}}" --comma-slugs)
        echo "Triggering bioentities for: $SLUGS"
        IFS=',' read -ra SPECIES_LIST <<< "$SLUGS"
        for sp in "${SPECIES_LIST[@]}"; do
          echo ""
          task trigger-bioentities \
            SPECIES="$sp" \
            RESOURCE="{{.RESOURCE}}" \
            ENVIRONMENT="{{.ENVIRONMENT}}" \
            TARGET="{{.TARGET}}" \
            FORCEALL="{{.FORCEALL}}" \
            GITLAB_SCR="{{.GITLAB_SCR}}" \
            PREFIX="{{.PREFIX}}"
        done

  trigger-indexing:
    desc: |
      Trigger Loading_bulk_using_indexing_pipeline_slurm.
      Usage: task trigger-indexing ACCESSIONS="E-MTAB-1234 E-GEOD-5678"
      Optional overrides: GITLAB_BRANCH=... TARGET_ENVIRONMENT=... RELOAD=... PREFIX=...
      Requires GXA_TARGET_JSON_URL / TARGET_ENVIRONMENT in .env to match (task gxa-print-urls).
    vars:
      ACCESSIONS: '{{.ACCESSIONS}}'
      GITLAB_BRANCH: '{{default "feature/k8s_compatibility" .GITLAB_BRANCH}}'
      TARGET_ENVIRONMENT: '{{default "k8s_test" .TARGET_ENVIRONMENT}}'
      RELOAD: '{{default "true" .RELOAD}}'
      PREFIX: '{{default "build_work" .PREFIX}}'
    preconditions:
      - sh: '[ -n "{{.ACCESSIONS}}" ]'
        msg: "ACCESSIONS is required. Usage: task trigger-indexing ACCESSIONS=\"E-MTAB-1234 E-GEOD-5678\""
    cmds:
      - |
        set -euo pipefail
        if [ -z "${GXA_TARGET_JSON_URL:-}" ]; then
          echo "ERROR: GXA_TARGET_JSON_URL is not set (see .env.example)" >&2
          exit 1
        fi
        echo "GXA_TARGET_JSON_URL=${GXA_TARGET_JSON_URL}"
        echo "TARGET_ENVIRONMENT={{.TARGET_ENVIRONMENT}}"
        DATA_ARGS=()
        add_param() {
          local name="$1" value="$2"
          [ -n "$value" ] && DATA_ARGS+=(--data-urlencode "${name}=${value}")
        }
        add_param "ACCESSIONS" "{{.ACCESSIONS}}"
        add_param "GITLAB_BRANCH" "{{.GITLAB_BRANCH}}"
        add_param "TARGET_ENVIRONMENT" "{{.TARGET_ENVIRONMENT}}"
        add_param "RELOAD" "{{.RELOAD}}"
        add_param "PREFIX" "{{.PREFIX}}"
        RESPONSE=$(curl -si \
          --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
          -X POST \
          "{{.JENKINS_URL}}/job/{{.JENKINS_JOB}}/buildWithParameters" \
          "${DATA_ARGS[@]}")
        echo "$RESPONSE"
        QUEUE_URL=$(echo "$RESPONSE" | grep -i "^location:" | tr -d '\r' | awk '{print $2}')
        if [ -n "$QUEUE_URL" ]; then
          echo ""
          echo "Queued at: $QUEUE_URL"
          echo "Poll queue item: curl --user \"\${JENKINS_USER}:\${JENKINS_TOKEN}\" \"${QUEUE_URL}api/json\" | python3 -m json.tool"
        fi

  open-solr:
    desc: Open Solr admin UI (NodePort; ENV must match solr-cloud helm release, e.g. ENV=staging)
    deps: [init-k8s]
    cmds:
      - |
        set -euo pipefail
        RELEASE="{{.RELEASE}}"
        ENV="{{.ENV}}"
        SOLR_NS="${RELEASE}-${ENV}-solrcloud"
        SOLR_SVC="${RELEASE}-${ENV}-solrcloud-nodeport"
        SOLR_NODE="$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null || true)"
        if [ -z "$SOLR_NODE" ]; then
          SOLR_NODE="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
        fi
        SOLR_PORT="$(kubectl get service "$SOLR_SVC" --namespace "$SOLR_NS" -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}' 2>/dev/null || true)"
        if [ -z "$SOLR_PORT" ]; then
          echo "Error: could not resolve NodePort from service $SOLR_SVC in namespace $SOLR_NS"
          echo "Hint: pass ENV matching the solr-cloud release (e.g. task open-solr ENV=staging)"
          exit 1
        fi
        SOLR_SERVER_URL="http://${SOLR_NODE}:${SOLR_PORT}/solr/#/"
        echo "SOLR_NODE=$SOLR_NODE SOLR_PORT=$SOLR_PORT"
        echo "Opening $SOLR_SERVER_URL"
        open "$SOLR_SERVER_URL"

  nginx-clear-cache:
    desc: |
      Clear GXA nginx proxy cache (shared PVC) and rollout-restart all pods (fresh keys_zone per replica).
      Usage: task nginx-clear-cache
      Optional: ENV=test
    vars:
      RELEASE: gxa
    deps:
      - task: init-k8s
        vars:
          RELEASE: gxa
    cmds:
      - |
        set -euo pipefail
        NAMESPACE="{{.NAMESPACE}}"
        echo "Clearing /var/cache/nginx on deployment/gxa (namespace ${NAMESPACE}, shared PVC)"
        # One exec is enough: cache PVC is ReadWriteMany. Rollout restarts every replica's nginx.
        kubectl exec -n "${NAMESPACE}" deployment/gxa -c nginx -- \
          sh -c 'rm -rf /var/cache/nginx/*'
        echo "Rolling out deployment/gxa to reset nginx in-memory cache on all pods..."
        kubectl rollout restart deployment/gxa --namespace "${NAMESPACE}"
        kubectl rollout status deployment/gxa --namespace "${NAMESPACE}" --timeout=300s
        echo "Done."

  nginx-cache-purge:build:
    desc: Build nginx-cache-purge image (ngx_cache_purge module)
    dir: "{{.NGINX_CACHE_PURGE_DIR}}"
    cmds:
      - |
        docker build \
          --pull \
          -t "{{.NGINX_CACHE_PURGE_IMAGE}}:{{.NGINX_CACHE_PURGE_TAG}}" \
          .

  nginx-cache-purge:login:
    desc: Log in to dockerhub.ebi.ac.uk (REGISTRY_USER, REGISTRY_PASSWORD)
    internal: true
    cmds:
      - |
        set -euo pipefail
        if [ -z "${REGISTRY_USER:-}" ] || [ -z "${REGISTRY_PASSWORD:-}" ]; then
          echo "Set REGISTRY_USER and REGISTRY_PASSWORD (EBI dockerhub API key)." >&2
          exit 1
        fi
        echo "${REGISTRY_PASSWORD}" | docker login "{{.NGINX_CACHE_PURGE_REGISTRY}}" \
          -u "${REGISTRY_USER}" --password-stdin

  nginx-cache-purge:push:
    desc: Push nginx-cache-purge image to EBI registry
    deps: [nginx-cache-purge:login, nginx-cache-purge:build]
    cmds:
      - docker push "{{.NGINX_CACHE_PURGE_IMAGE}}:{{.NGINX_CACHE_PURGE_TAG}}"

  nginx-cache-purge:build-push:
    desc: Build and push nginx-cache-purge (TAG defaults to 1.29.5)
    deps: [nginx-cache-purge:push]
