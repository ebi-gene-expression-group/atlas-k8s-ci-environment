# https://taskfile.dev
# Install: https://taskfile.dev/installation/
# Usage: `task` lists tasks; `task deploy RELEASE=scxa ENV=test`

version: "3"

silent: true

dotenv:
  - .env

env:
  BAO_ADDR: 'https://openbao.hh-webadmin-35.wp-k8s.ebi.ac.uk'
  BAO_SKIP_VERIFY: 'true'

vars:
  # Dotenv is not in the environment when Task vars are evaluated, and a var named
  # ENV also shadows ${ENV}. Source .env in a subshell, then default.
  RELEASE: '{{.RELEASE | default "gxa"}}'
  ENV: '{{.ENV | default "test"}}'
  K8S_CONTEXT: '{{.K8S_CONTEXT | default "fg-public"}}'
  SUPPORTED_ENVS: test staging public fallback
  APP_VERSION: 37.6.79
  NAMESPACE: "{{.RELEASE}}-{{.ENV}}"
  ENV_VALUES: charts/{{.RELEASE}}/values-{{.ENV}}.yaml
  CHART_PATH: charts/{{.RELEASE}}
  # Jenkins — set JENKINS_USER and JENKINS_TOKEN in .env
  JENKINS_URL: '{{.JENKINS_URL | default "https://wwwint.ebi.ac.uk/fg/jenkins"}}'
  JENKINS_JOB: Loading_bulk_using_indexing_pipeline_slurm
  JENKINS_BIOENTITIES_JOB: H_bioentities_loading_pipeline_bulk_and_sc
  # WAR_FILE_NAME: override via .env or env var (default: $RELEASE.war)
  CURL_DEBUG_OPTS: "--progress-bar"
  NGINX_CACHE_PURGE_DIR: nginx-cache-purge
  NGINX_CACHE_PURGE_REGISTRY: dockerhub.ebi.ac.uk
  NGINX_CACHE_PURGE_IMAGE: dockerhub.ebi.ac.uk/ebi-gene-expression/atlas-web-bulk/nginx-cache-purge
  NGINX_CACHE_PURGE_TAG:
    sh: echo "${TAG:-1.29.5}"

tasks:
  default:
    desc: List all tasks with descriptions (same as task --list)
    silent: true
    cmds:
      - task --list

  init-k8s:
    desc: Switch kubectl context (K8S_CONTEXT from env or .env) and default namespace for this RELEASE/ENV
    cmds:
      - kubectx "${K8S_CONTEXT}"
      - kubectl config set-context --current --namespace={{.NAMESPACE}}
      - echo "K8S_CONTEXT={{.K8S_CONTEXT}} NAMESPACE={{.NAMESPACE}}"
      - echo "RELEASE={{.RELEASE}} ENV={{.ENV}}"

  webapp:deploy:
    desc: Deploy the Atlas web app Helm chart (gxa or scxa) via helm upgrade --install
    deps: [init-k8s]
    cmds:
      - |
        set -euo pipefail
        RELEASE="{{.RELEASE}}"
        ENV="{{.ENV}}"
        SUPPORTED="{{.SUPPORTED_ENVS}}"
        ENV_VALUES="{{.ENV_VALUES}}"
        if ! echo " $SUPPORTED " | grep -q " $ENV "; then
          if [ ! -f "$ENV_VALUES" ]; then
            echo "Error: unknown ENV '$ENV'. Use one of: $SUPPORTED, or add $ENV_VALUES"
            exit 1
          fi
        fi
        HELM_SET_ARGS=(--set "appVersion={{.APP_VERSION}}")
        HELM_SET_ARGS+=(--set "image.tag={{.APP_VERSION}}")
        if [ -n "${INGRESS_HOST_BASE:-}" ]; then
          HELM_SET_ARGS+=(--set "ingress.hostBase=${INGRESS_HOST_BASE}")
        fi
        if [ -n "${DOCKER_CONFIG_JSON:-}" ]; then
          DOCKER_CONFIG_JSON="${DOCKER_CONFIG_JSON//\"/}"
          HELM_SET_ARGS+=(--set-file "registrySecret.dockerconfigjson=${DOCKER_CONFIG_JSON}")
        fi
        SECRETS_FILE="charts/${RELEASE}/.secrets-${ENV}.yaml"
        if [ -f "$SECRETS_FILE" ]; then
          echo "Using secrets file: $SECRETS_FILE"
          HELM_SET_ARGS+=(-f "$SECRETS_FILE")
        fi
        if [ "$ENV" != "fallback" ]; then
          # platform-secrets-propagate owns gxa-registry on fg-public
          HELM_SET_ARGS+=(--set "imagePullSecret.create=false")
        fi
        HELM_DEBUG_FLAGS=()
        case "${DEBUG:-}" in
          1|true|yes)
            echo "Running Helm in DEBUG dry-run mode (DEBUG=${DEBUG:-})"
            HELM_DEBUG_FLAGS=(--debug --dry-run)
            ;;
        esac
      
        helm upgrade --install \
          "$RELEASE" \
          "charts/${RELEASE}" \
          --namespace "{{.NAMESPACE}}" \
          -f "$ENV_VALUES" \
          "${HELM_SET_ARGS[@]}" \
          "${HELM_DEBUG_FLAGS[@]}"

  solr:deploy:
    desc: |
      Deploy solr-cloud chart. Helm release defaults to {RELEASE}-{ENV} (override with SOLR_HELM_RELEASE);
      namespace is {RELEASE}-{ENV}-solrcloud. Set FORCE_CONFLICTS=1 if Helm 4 reports SSA conflicts.
    cmds:
      - |
        set -euo pipefail
        kubectx "${K8S_CONTEXT}"
        RELEASE="{{.RELEASE}}"
        ENV="{{.ENV}}"
        SOLR_HELM_RELEASE="${SOLR_HELM_RELEASE:-${RELEASE}-${ENV}}"
        NS="${RELEASE}-${ENV}-solrcloud"
        VALUES="charts/solr-cloud/values-${ENV}.yaml"
        if [ ! -f "$VALUES" ]; then
          echo "Error: missing $VALUES (add values-${ENV}.yaml or pick another ENV)"
          exit 1
        fi
        if ! kubectl get namespace "$NS" >/dev/null 2>&1; then
          echo "Error: namespace $NS does not exist. Create it via your platform team (team-admin cannot patch namespaces)." >&2
          exit 1
        fi
        # ZK NFS PV+PVC must exist before the Solr operator creates StatefulSets;
        # otherwise the operator creates PVCs without volumeName and they stay Pending.
        rendered="$(helm template "$SOLR_HELM_RELEASE" charts/solr-cloud \
          --namespace "$NS" \
          -f "$VALUES" \
          -s templates/zk-nfs-data-pv.yaml 2>/dev/null || true)"
        if [ -n "$rendered" ]; then
          echo "$rendered" | kubectl apply -f -
        fi
        HELM_EXTRA=()
        case "${FORCE_CONFLICTS:-}" in
          1|true|yes) HELM_EXTRA+=(--force-conflicts) ;;
        esac
        helm upgrade --install "$SOLR_HELM_RELEASE" charts/solr-cloud \
          --namespace "$NS" \
          -f "$VALUES" \
          --create-namespace=false \
          "${HELM_EXTRA[@]}"

  solr:uninstall:
    desc: Uninstall solr-cloud Helm release {RELEASE}-{ENV} from namespace {RELEASE}-{ENV}-solrcloud
    cmds:
      - |
        set -euo pipefail
        kubectx "${K8S_CONTEXT}"
        RELEASE="{{.RELEASE}}"
        ENV="{{.ENV}}"
        SOLR_HELM_RELEASE="${SOLR_HELM_RELEASE:-${RELEASE}-${ENV}}"
        NS="${RELEASE}-${ENV}-solrcloud"
        helm uninstall "$SOLR_HELM_RELEASE" --namespace "$NS"

  solr:fix-zk-pvcs:
    desc: |
      Fix ZK PVCs stuck Pending (operator created them without volumeName).
      Deletes broken Pending PVCs and re-applies Helm NFS PV/PVC manifests.
    cmds:
      - |
        set -euo pipefail
        kubectx "${K8S_CONTEXT}"
        RELEASE="{{.RELEASE}}"
        ENV="{{.ENV}}"
        SOLR_HELM_RELEASE="${SOLR_HELM_RELEASE:-${RELEASE}-${ENV}}"
        NS="${RELEASE}-${ENV}-solrcloud"
        VALUES="charts/solr-cloud/values-${ENV}.yaml"
        for i in 0 1 2; do
          PVC="data-${SOLR_HELM_RELEASE}-solrcloud-zookeeper-${i}"
          VN="$(kubectl get pvc "$PVC" -n "$NS" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)"
          PHASE="$(kubectl get pvc "$PVC" -n "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          if [ "$PHASE" = "Pending" ] && [ -z "$VN" ]; then
            echo "Deleting broken PVC $PVC (Pending, no volumeName)"
            kubectl delete pvc "$PVC" -n "$NS" --wait=true
          elif [ -n "$VN" ]; then
            echo "OK: $PVC bound to $VN"
          else
            echo "Skip: $PVC (phase=${PHASE:-missing})"
          fi
        done
        helm template "$SOLR_HELM_RELEASE" charts/solr-cloud \
          --namespace "$NS" \
          -f "$VALUES" \
          -s templates/zk-nfs-data-pv.yaml | kubectl apply -f -
        echo "Recreate ZK pods if needed: kubectl delete pod -n $NS -l app=${SOLR_HELM_RELEASE}-solrcloud-zookeeper"

  webapp:uninstall:
    desc: Remove the Atlas web app Helm release from the namespace
    cmds:
      - |
        set -euo pipefail
        RELEASE="{{.RELEASE}}"
        ENV="{{.ENV}}"
        SUPPORTED="{{.SUPPORTED_ENVS}}"
        ENV_VALUES="{{.ENV_VALUES}}"
        if ! echo " $SUPPORTED " | grep -q " $ENV "; then
          if [ ! -f "$ENV_VALUES" ]; then
            echo "Error: unknown ENV '$ENV'. Use one of: $SUPPORTED, or add $ENV_VALUES"
            exit 1
          fi
        fi
        helm uninstall \
          "$RELEASE" \
          --namespace "{{.NAMESPACE}}" 

  print-env:
    desc: Print current RELEASE and ENV (and related paths)
    cmds:
      - echo "ENV={{.ENV}} RELEASE={{.RELEASE}} NAMESPACE={{.NAMESPACE}} VALUES={{.ENV_VALUES}}"

  monitoring:open:
    desc: Open Grafana namespace pods dashboard for this namespace (EBI internal URL)
    cmds:
      - |
        open "https://grafana-hh-webadmin-35.wp-k8s.ebi.ac.uk/d/85a562078cdf77779eaa1add43ccec1e/kubernetes-compute-resources-namespace-pods?orgId=1&refresh=10s&var-datasource=default&var-cluster=&var-namespace={{.NAMESPACE}}"

  webapp:open:
    desc: Open the app in a browser via the GXA service NodePort
    deps: [init-k8s]
    cmds:
      - |
        set -euo pipefail
        RELEASE="{{.RELEASE}}"
        NAMESPACE="{{.NAMESPACE}}"
        CTX_PATH="/gxa"
        NODE_HOSTNAME="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
        SERVICE_PORT="$(kubectl get service "$RELEASE" --namespace "$NAMESPACE" \
          -o jsonpath='{.spec.ports[0].nodePort}')"
        URL="http://${NODE_HOSTNAME}:${SERVICE_PORT}${CTX_PATH}"
        echo "Opening $URL"
        open "$URL"

  cache:purge-all:
    desc: Purge all cache
    vars:
      BASIC_AUTH_USER:
        # make sure to be logged in to bao
        sh: 'bao kv get -mount=kv -format yaml -field username gxa/{{.ENV}}/ops/nginx-cache-purge'
        secret: true
      BASIC_AUTH_PASSWORD:
        sh: 'bao kv get -mount=kv -format yaml -field password gxa/{{.ENV}}/ops/nginx-cache-purge'
        secret: true
    cmds:
      - |
        set -euo pipefail
        CTX_PATH="/gxa"
        NODE_HOSTNAME="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
        SERVICE_PORT="$(kubectl get service "{{.RELEASE}}" --namespace "{{.NAMESPACE}}" \
          -o jsonpath='{.spec.ports[0].nodePort}')"
        BASE_URL="http://${NODE_HOSTNAME}:${SERVICE_PORT}${CTX_PATH}"
        curl -s -u "{{.BASIC_AUTH_USER}}:{{.BASIC_AUTH_PASSWORD}}" \
          -X PURGE "${BASE_URL}/_ops/cache/purge-all" \
          | yq -p xml .

  cache:warmup:
    desc: Warm up the cache
    deps: [init-k8s]
    vars:
      NODE_HOSTNAME:
        sh: "kubectl get nodes -o jsonpath='{.items[0].metadata.name}'"
      SERVICE_PORT:
        sh: "kubectl get service {{.RELEASE}} --namespace {{.NAMESPACE}} \
          -o jsonpath='{.spec.ports[0].nodePort}'"
      CTX_PATH: "/gxa"
    env:
      BASE_URL: "http://{{.NODE_HOSTNAME}}:{{.SERVICE_PORT}}{{.CTX_PATH}}"
    cmds:
      - |
        set -euo pipefail
        ./scripts/hit-gxa-experiment-pages.sh

  test:system:
    desc: Live Tavern GXA JSON journey (GXA_SYSTEM_BASE or ENV=ci|staging|public|fallback)
    cmds:
      - |
        set -euo pipefail
        if [ ! -x tests/system/.venv/bin/python ]; then
          python3 -m venv tests/system/.venv
        fi
        tests/system/.venv/bin/pip install -q -r tests/system/requirements.txt
        if [ -z "${GXA_SYSTEM_BASE:-}" ]; then
          TARGET_ENV="${GXA_ENV:-{{.ENV}}}"
          export GXA_SYSTEM_BASE="$(tests/system/.venv/bin/python tests/system/resolve_base.py "${TARGET_ENV}")"
        fi
        export GXA_SYSTEM_BASE="${GXA_SYSTEM_BASE%/}"
        echo "GXA_SYSTEM_BASE=${GXA_SYSTEM_BASE}"
        mkdir -p reports
        PYTHONPATH=tests/system tests/system/.venv/bin/python -m pytest tests/system -v \
          --junitxml=reports/system-junit.xml -o junit_logging=all

  test:browser:
    desc: Playwright GXA page scenarios (GXA_SYSTEM_BASE or ENV=ci|staging|public|fallback). Add tests/browser/scenarios/test_*.py
    cmds:
      - |
        set -euo pipefail
        if [ ! -x tests/browser/.venv/bin/python ]; then
          python3 -m venv tests/browser/.venv
        fi
        tests/browser/.venv/bin/pip install -q -r tests/browser/requirements.txt
        tests/browser/.venv/bin/playwright install chromium
        if [ -z "${GXA_SYSTEM_BASE:-}" ]; then
          TARGET_ENV="${GXA_ENV:-{{.ENV}}}"
          export GXA_SYSTEM_BASE="$(tests/browser/.venv/bin/python tests/system/resolve_base.py "${TARGET_ENV}")"
        fi
        export GXA_SYSTEM_BASE="${GXA_SYSTEM_BASE%/}"
        echo "GXA_SYSTEM_BASE=${GXA_SYSTEM_BASE}"
        mkdir -p reports
        cd tests/browser
        .venv/bin/python -m pytest -v --junitxml=../../reports/browser-junit.xml

  test:browser:show:
    desc: Open the Playwright trace viewer (each action, with screenshots) from the last test:browser run
    cmds:
      - |
        set -euo pipefail
        latest="$(find reports/playwright -name 'trace*.zip' -print0 2>/dev/null | xargs -0 ls -t 2>/dev/null | head -1 || true)"
        if [ -z "${latest}" ]; then
          echo "No traces in reports/playwright. Run task test:browser first." >&2
          exit 1
        fi
        echo "Opening ${latest}"
        echo "Other traces:"
        find reports/playwright -name 'trace*.zip' | sort
        exec tests/browser/.venv/bin/playwright show-trace "${latest}"

  jenkins:upsert-secrets:
    desc: |
      Create or update Jenkins Secret file {{.RELEASE}}-secrets-{{.ENV}} from charts/{{.RELEASE}}/.secrets-{{.ENV}}.yaml
      Usage: task jenkins-upsert-secrets
      Override: ENV=public FILE=... ID=... JENKINS_CREDENTIALS_STORE=...
    cmds:
      - |
        set -euo pipefail
        export ENV="{{.ENV}}" RELEASE="{{.RELEASE}}"
        export JENKINS_URL="{{.JENKINS_URL}}"
        exec "{{.ROOT_DIR}}/scripts/jenkins-upsert-gxa-secrets.sh"

  jenkins:params:
    desc: List parameters accepted by the indexing pipeline job
    cmds:
      - |
        curl -fsSL \
          --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
          "{{.JENKINS_URL}}/job/{{.JENKINS_JOB}}/api/json?tree=property\[parameterDefinitions\[name,type\]\]" \
          | jq

  solr:open:
    desc: Open Solr admin UI (NodePort; uses Helm release {RELEASE}-{ENV}, e.g. ENV=staging → gxa-staging-solrcloud-nodeport)
    deps: [init-k8s]
    cmds:
      - |
        set -euo pipefail
        RELEASE="{{.RELEASE}}"
        ENV="{{.ENV}}"
        SOLR_NS="${RELEASE}-${ENV}-solrcloud"
        SOLR_SVC="${RELEASE}-${ENV}-solrcloud-nodeport"
        SOLR_NODE="$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null || true)"
        if [ -z "$SOLR_NODE" ]; then
          SOLR_NODE="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
        fi
        SOLR_PORT="$(kubectl get service "$SOLR_SVC" --namespace "$SOLR_NS" -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}' 2>/dev/null || true)"
        if [ -z "$SOLR_PORT" ]; then
          echo "Error: could not resolve NodePort from service $SOLR_SVC in namespace $SOLR_NS"
          echo "Hint: pass ENV matching the solr-cloud release (e.g. task open-solr ENV=staging)"
          exit 1
        fi
        SOLR_SERVER_URL="http://${SOLR_NODE}:${SOLR_PORT}/solr/#/"
        echo "SOLR_NODE=$SOLR_NODE SOLR_PORT=$SOLR_PORT"
        echo "Opening $SOLR_SERVER_URL"
        open "$SOLR_SERVER_URL"

  nginx-cache-purge:build:
    desc: Build nginx-cache-purge image (ngx_cache_purge module)
    dir: "{{.NGINX_CACHE_PURGE_DIR}}"
    cmds:
      - |
        docker build \
          --pull \
          -t "{{.NGINX_CACHE_PURGE_IMAGE}}:{{.NGINX_CACHE_PURGE_TAG}}" \
          .

  nginx-cache-purge:login:
    desc: Log in to dockerhub.ebi.ac.uk (REGISTRY_USER, REGISTRY_PASSWORD)
    internal: true
    cmds:
      - |
        set -euo pipefail
        if [ -z "${REGISTRY_USER:-}" ] || [ -z "${REGISTRY_PASSWORD:-}" ]; then
          echo "Set REGISTRY_USER and REGISTRY_PASSWORD (EBI dockerhub API key)." >&2
          exit 1
        fi
        echo "${REGISTRY_PASSWORD}" | docker login "{{.NGINX_CACHE_PURGE_REGISTRY}}" \
          -u "${REGISTRY_USER}" --password-stdin

  nginx-cache-purge:push:
    desc: Push nginx-cache-purge image to EBI registry
    deps: [nginx-cache-purge:login, nginx-cache-purge:build]
    cmds:
      - docker push "{{.NGINX_CACHE_PURGE_IMAGE}}:{{.NGINX_CACHE_PURGE_TAG}}"

  nginx-cache-purge:build-push:
    desc: Build and push nginx-cache-purge (TAG defaults to 1.29.5)
    deps: [nginx-cache-purge:push]

  openbao:deploy:
    desc: |
      Deploy OpenBao to namespace openbao on fg-public, then init/unseal if needed.
      Unseal keys are written to charts/openbao/.secrets-init-public.yaml (gitignored).
    cmds:
      - |
        set -euo pipefail
        # values-public.yaml is for hh-wp-webadmin-35; do not follow .env K8S_CONTEXT.
        CONTEXT="${OPENBAO_K8S_CONTEXT:-fg-public}"
        NS=openbao
        CHART_VERSION="${OPENBAO_CHART_VERSION:-0.29.0}"
        kubectx "${CONTEXT}"
        kubectl --context "${CONTEXT}" create namespace "${NS}" --dry-run=client -o yaml \
          | kubectl --context "${CONTEXT}" apply -f -
        helm repo add openbao https://openbao.github.io/openbao-helm >/dev/null 2>&1 || true
        helm repo update openbao
        CHART_DIR="$(mktemp -d)"
        trap 'rm -rf "$CHART_DIR"' EXIT
        helm pull openbao/openbao --version "$CHART_VERSION" --untar -d "$CHART_DIR"
        # Packaged chart uses single quotes and requires Kubernetes 1.30+; fg-public is 1.23.8.
        sed -i.bak "s/kubeVersion: '>= 1.30.0-0'/kubeVersion: \">= 1.23.0-0\"/" \
          "$CHART_DIR/openbao/Chart.yaml"
        grep kubeVersion "$CHART_DIR/openbao/Chart.yaml"
        if grep -q '1.30' "$CHART_DIR/openbao/Chart.yaml"; then
          echo "Error: failed to relax chart kubeVersion for Kubernetes 1.23" >&2
          exit 1
        fi
        helm upgrade --install openbao "$CHART_DIR/openbao" \
          --kube-context "${CONTEXT}" \
          -n "${NS}" \
          -f charts/openbao/values-public.yaml \
          --disable-openapi-validation \
          --timeout 10m
        # StatefulSet updateStrategy is OnDelete; bounce the pod to pick up image/config.
        # Wait until the old pod is gone so unseal does not race against the previous replica.
        kubectl --context "${CONTEXT}" -n "${NS}" delete pod openbao-0 --wait=true --timeout=3m 2>/dev/null || true
        K8S_CONTEXT="${CONTEXT}" OPENBAO_NAMESPACE="${NS}" ./scripts/openbao-init-unseal.sh

  openbao:apply-acl:
    desc: |
      Apply OpenBao ACL catalog on fg-public (KV v2, Google OIDC allowlist, identity groups/roles).
      Requires charts/openbao/.secrets-init-public.yaml and .secrets-oidc-public.yaml.
    cmds:
      - ./scripts/openbao-apply-acl.sh

