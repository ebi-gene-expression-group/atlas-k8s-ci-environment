apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-solrcloud-bulk-analytics-populator
  namespace: jenkins-gene-expression
spec:
  template:
    spec:
      volumes:
        - name: {{ include "app.name" . }}-bulk-analytics-jsonl-vol
          persistentVolumeClaim:
            claimName: bulk-analytics-jsonl-rwo
        - name: scratch-bulk-analytics-vol
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                storageClassName: "premium-rwo"
                resources:
                  requests:
                    storage: 200Gi
      containers:
        - name: {{ include "app.name" . }}-solrcloud-populator
          image: openjdk:11
          env:
            - name: SOLR_HOST
              value: "{{ include "app.name" . }}-solrcloud-0.{{ include "app.name" . }}-solrcloud-headless.jenkins-gene-expression.svc.cluster.local:8983"
            - name: SOLR_HOSTS
              value: "{{ include "app.name" . }}-solrcloud-0.{{ include "app.name" . }}-solrcloud-headless.jenkins-gene-expression.svc.cluster.local:8983 {{ include "app.name" . }}-solrcloud-1.{{ include "app.name" . }}-solrcloud-headless.jenkins-gene-expression.svc.cluster.local:8983 {{ include "app.name" . }}-solrcloud-2.{{ include "app.name" . }}-solrcloud-headless.jenkins-gene-expression.svc.cluster.local:8983 {{ include "app.name" . }}-solrcloud-3.{{ include "app.name" . }}-solrcloud-headless.jenkins-gene-expression.svc.cluster.local:8983"
            - name: SOLR_NUM_SHARDS
              value: "4"
            - name: NUM_DOCS_PER_BATCH
              value: "10000"
            - name: SOLR_COMMIT_DOCS
              value: "500000"
            - name: SOLR_COLLECTION
              value: "bulk-analytics"
            - name: SCHEMA_VERSION
              value: "1"
            # Consider moving this to an export line in the script (?)
            - name: SOLR_PROCESSORS
              value: "dedupe"
          resources:
            requests:
              cpu: 0.1
              memory: 128Mi
            limits:
              cpu: 0.25
              memory: 1Gi
          command: ["/bin/bash", "-c"]
          args:
            - |
              apt-get install -y --no-install-recommends git
              
              mkdir /work
              
              cd /work
              
              git clone --recurse-submodules --depth 1 --single-branch https://github.com/ebi-gene-expression-group/index-bioentities.git
              git clone --recurse-submodules --depth 1 --single-branch https://github.com/ebi-gene-expression-group/solr-bulk.git
              
              cd /work/solr-bulk/bin
              ./create-bulk-analytics-collection.sh
              ./create-bulk-analytics-schema.sh

              # We go back to index-bioentities/bin because the solr-jsonl-chunk-loader.sh script isn’t in the solr-bulk repository
              cd /atlas-data/scratch
              for FILE in `ls /atlas-data/bulk-analytics-jsonl/*.jsonl`
              do
                INPUT_JSONL=${FILE} /work/index-bioentities/bin/solr-jsonl-chunk-loader.sh >> /dev/stdout 2>&1
              done
          volumeMounts:
            - mountPath: "/atlas-data/bulk-analytics-jsonl"
              name: {{ include "app.name" . }}-bulk-analytics-jsonl-vol
            - mountPath: "/atlas-data/scratch"
              name: scratch-bulk-analytics-vol
      restartPolicy: Never
