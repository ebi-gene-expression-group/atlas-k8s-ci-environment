apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gxa-data-rwo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-nfs-production
  resources:
    requests:
      storage: 70Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gxa-data-ontology-rwo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-nfs-production
  resources:
    requests:
      storage: 1Gi
