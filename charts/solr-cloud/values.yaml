# Environment name for NFS paths: .../gxa/environments/<environment>/{solr_data,zk_data}/...
# Pass at install time: helm ... --set environment=dev
#
# Helm release name must be {chart}-{environment} (e.g. gxa-staging), not bare "gxa".
# Namespace is typically {release}-solrcloud (e.g. gxa-staging-solrcloud). See README.md.
environment: ""

# fg_atlas ownership on Isilon NFS exports (same as gxa chart).
# Init containers that read NFS run as this user (root is squashed on Isilon).
nfsSecurityContext:
  runAsUser: 2921
  runAsGroup: 1146
# fsGroup lets the Solr/ZK runtime user read symlinks created by the init container.
podSecurityContext:
  fsGroup: 1146
  supplementalGroups:
    - 1146

solr:
  replicas: 4
  image:
    tag: 8.7.0
  javaMem: "-Xms8000m -Xmx8000m"
  opts: >-
    -Denable.packages=true
    -Dblob.max.size.mb=100
    -Dsolr.port.advertise=8983
  gcTune: >-
    -XX:SurvivorRatio=4
    -XX:TargetSurvivorRatio=90
    -XX:MaxTenuringThreshold=8
  resources:
    limits:
      memory: 9Gi
      cpu: 3
    requests:
      memory: 7Gi
      cpu: 2
  storage:
    className: standard-nfs-production
    size: 20Gi
    reclaimPolicy: Retain
    # NFS migration: mount Isilon data in the pod (mode: pod) or via PV+PVC (mode: pv).
    # Pod mode matches gxa services-volume / backup NFS — required for direct Isilon exports.
    # Folders under basePath: <pod-name>/ (may be symlinks). Init links entries into /var/solr/data.
    # Solr writes index updates through those symlinks — solr_data must be RW from K8s node IPs.
    nfsData:
      enabled: true
      mode: pod
      mountPath: /solr-data
      basePath: ""
      # Folder under solr_data: {dataDirPrefix}-solrcloud-{ordinal}. Defaults to Helm release name.
      # Set when NFS symlinks predate a release rename (e.g. staging: dataDirPrefix=gxa).
      dataDirPrefix: ""
  secret:
    name: solrcloud-package-store-keys
    mountPath: /keys

zookeeper:
  replicas: 3
  storage:
    className: standard-nfs-production
    size: 500Mi
    reclaimPolicy: Retain
    # pv: NFS PV+PVC per replica mounted at /data (ZK must write version-2; symlinks do not work).
    # pod: parent export at /zk-data, init links into ephemeral /data (Solr-style; not suitable for ZK).
    nfsData:
      enabled: true
      mode: pv
      mountPath: /zk-data
      basePath: ""
      dataDirPrefix: ""
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 512Mi
      cpu: 500m

service:
  nodePort: null

nfs:
  server: hh-isi-srv-vlan1496.ebi.ac.uk
  # /ifs/public/rw/fg/atlas/gxa/environments/<environment>/{solr_data,zk_data}/<pod-name>/
  environmentsBase: /ifs/public/rw/fg/atlas/gxa/environments
  # Used only when nfsData.mode is pv (pod-mode NFS has no mountOptions in the pod spec).
  mountOptions:
    - hard
    - nfsvers=3
