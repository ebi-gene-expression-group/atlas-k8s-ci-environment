solr:
  replicas: 4
  image:
    tag: 8.7.0
  javaMem: "-Xms4000m -Xmx5000m"
  opts: >-
    -Denable.packages=true
    -Dblob.max.size.mb=100
    -Dsolr.port.advertise=8983
  gcTune: >-
    -XX:SurvivorRatio=4
    -XX:TargetSurvivorRatio=90
    -XX:MaxTenuringThreshold=8
  resources:
    limits:
      memory: 9Gi
      cpu: 4
    requests:
      memory: 7Gi
      cpu: 3
  storage:
    className: standard-nfs-production
    size: 20Gi
    reclaimPolicy: Retain
  secret:
    name: solrcloud-package-store-keys
    mountPath: /keys

zookeeper:
  replicas: 3
  storage:
    className: standard-nfs-production
    size: 500Mi
  resources:
    limits:
      memory: 512Mi
      cpu: 0.5
    requests:
      memory: 512Mi
      cpu: 0.5

service:
  nodePort: null   # Assign a port (30000–32767)

nfs:
  server: hh-isi-srv-vlan1496.ebi.ac.uk
