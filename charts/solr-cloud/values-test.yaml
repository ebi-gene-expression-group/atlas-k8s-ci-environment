# values for solr-cloud test env (hh-wp-webadmin-35 / fg-public)
environment: test

solr:
  storage:
    nfsData:
      # Migrated Isilon symlinks are gxa-solrcloud-{n}, not gxa-test-solrcloud-{n}.
      dataDirPrefix: gxa
  # Same ~90GB/shard bulk-analytics indexes as ci/staging; inherit javaMem (8Gi heap)
  # from values.yaml. A 1.5Gi heap OOMed on ci under Jenkins streaming-expression ITs.
  resources:
    limits:
      memory: 9Gi
      cpu: "2"
    requests:
      memory: 7Gi
      cpu: "500m"
