# scxa-staging-solrcloud-values.yaml
solr:
  replicas: 4
  image:
    tag: 8.7.0
  javaMem: "-Xms2000m -Xmx3000m"
  # TODO: maxBooleanClauses should not be in the helm values file. 
  # It is set by the setup script index-scxa/bin/create-scxa-analytics-collection.sh
  opts: "-Denable.packages=true -Dblob.max.size.mb=100 -Dsolr.port.advertise=8983 -Dsolr.max.booleanClauses=100000000 -Dsolr.allowPaths=/var/solr/backup"
  gcTune: "-XX:SurvivorRatio=4 -XX:TargetSurvivorRatio=90 -XX:MaxTenuringThreshold=8"
  packages:
    hookJob:
      enabled: true
      packageName: biosolr
      packageVersion: "2.0.0"
      upload:
        destFilestorePath: /biosolr/2.0.0/biosolr.jar
        nfs:
          subPath: fg/atlas/biosolr/solr-ontology-update-processor-2.0.0.jar
  bioSolr:
    enabled: true  
  resources:
    limits:
      memory: 6Gi
      cpu: 1
    requests:
      memory: 4.5Gi
      cpu: 1
  storage:
    className: standard-nfs-production
    size: 20Gi
    reclaimPolicy: Retain
  secret:
    enabled: false
    name: solrcloud-package-store-keys
    mountPath: /keys

zookeeper:
  replicas: 3
  storage:
    className: standard-nfs-production
    size: 500Mi
  resources:
    limits:
      memory: 512Mi
      cpu: 0.5
    requests:
      memory: 512Mi
      cpu: 0.5

service:
   nodePort: null   # Assign a port (30000–32767)
