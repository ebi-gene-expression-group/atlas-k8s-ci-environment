apiVersion: solr.apache.org/v1beta1
kind: SolrCloud
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  solrSecurity:
    authenticationType: Basic
  dataStorage:
    persistent:
      reclaimPolicy: {{ .Values.solr.storage.reclaimPolicy }}
      pvcTemplate:
        spec:
          storageClassName: {{ .Values.solr.storage.className }}
          resources:
            requests:
              storage: {{ .Values.solr.storage.size }}
  replicas: {{ .Values.solr.replicas }}
  solrImage:
    tag: {{ .Values.solr.image.tag }}
  solrJavaMem: {{ .Values.solr.javaMem | quote }}
  solrOpts: {{ .Values.solr.opts | quote }}
  solrGCTune: {{ .Values.solr.gcTune | quote }}
  customSolrKubeOptions:
    podOptions:
      resources:
        limits:
          memory: {{ .Values.solr.resources.limits.memory }}
          cpu: {{ .Values.solr.resources.limits.cpu }}
        requests:
          memory: {{ .Values.solr.resources.requests.memory }}
          cpu: {{ .Values.solr.resources.requests.cpu }}
      {{- $secret := .Values.solr.secret | default dict }}
      {{- $bioSolr := .Values.solr.bioSolr | default dict }}
      volumes:
          - name: backup-volume
            {{- include "solr.backup.volume.source" . | nindent 12 }}
            defaultContainerMount:
              name: backup-volume
              mountPath: /var/solr/backup
        {{- if ($secret.enabled | default false) }}
          - name: keys-secret
            source:
              secret:
                secretName: {{ $secret.name }}
            defaultContainerMount:
              name: keys-secret
              mountPath: {{ $secret.mountPath }}
        {{- end }}
        {{- if ($bioSolr.enabled | default false) }}
          - name: scatlas-owl-volume
            {{- include "bioSolr.volume.source" . | nindent 12 }}
            defaultContainerMount:
              name: scatlas-owl-volume
              mountPath: /var/solr/data/userfiles/scatlas.owl
              subPath: fg/atlas/biosolr/scatlas.owl
        {{- end }}
  zookeeperRef:
    provided:
      persistence:
        spec:
          storageClassName: {{ .Values.zookeeper.storage.className }}
          resources:
            requests:
              storage: {{ .Values.zookeeper.storage.size }}
      replicas: {{ .Values.zookeeper.replicas }}
      zookeeperPodPolicy:
        resources:
          limits:
            memory: {{ .Values.zookeeper.resources.limits.memory }}