{{- $solr := (.Values.solr | default dict) -}}
{{- $packages := ($solr.packages | default dict) -}}
{{- $hj := ($packages.hookJob | default dict) -}}
{{- if ($hj.enabled | default false) }}
{{- $upload := ($hj.upload | default dict) -}}
{{- $uploadNfs := ($upload.nfs | default dict) -}}
{{- $pkgName := ($hj.packageName | default "") -}}
{{- $pkgVer := ($hj.packageVersion | default "") -}}
{{- $dest := ($upload.destFilestorePath | default "") -}}
{{- $wait := ($hj.wait | default dict) -}}
{{- $sigSecret := ($hj.signingKeySecretName | default "solrcloud-package-store-keys") -}}
{{- $sigPrivKey := ($hj.signingPrivateKeyFile | default (printf "%s-solrcloud.pem" .Release.Name) ) -}}
{{- $sigPubKey := ($hj.signingPublicKeyFile | default (printf "%s-solrcloud.der" .Release.Name) ) -}}
{{- if or (eq $pkgName "") (eq $pkgVer "") (eq $dest "") -}}
{{- fail "solr.packages.hookJob requires packageName, packageVersion, and upload.destFilestorePath" -}}
{{- end }}
{{- if or (eq ($uploadNfs.subPath | default "") "") (not (hasKey .Values "nfs")) -}}
{{- /* For the implicit mode, we assume the jar is mounted from NFS into the Job pod. */ -}}
{{- fail "solr.packages.hookJob implicit upload requires upload.nfs.subPath (and .Values.nfs.server)" -}}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-solr-package-hook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: solr-cloud
    {{- include "solr-cloud.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ $hj.backoffLimit | default 2 }}
  ttlSecondsAfterFinished: {{ $hj.ttlSecondsAfterFinished | default 300 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: solr-cloud
        {{- include "solr-cloud.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      volumes:
        - name: package-jar
          nfs:
            server: {{ ($uploadNfs.server | default .Values.nfs.server) | quote }}
            path: {{ ($uploadNfs.path | default "/ifs/public/services") | quote }}
        {{- if ne $sigSecret "" }}
        - name: signing-keys
          secret:
            secretName: {{ $sigSecret | quote }}
        {{- end }}
      containers:
        - name: solr-package
          # solr image has both curl and openssl, needed for JAR signing
          image: {{ printf "solr:%s" (.Values.solr.image.tag | default "8.7.0") | quote }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: package-jar
              mountPath: {{ ($upload.localJarPath | default "/input/biosolr.jar") | quote }}
              subPath: {{ ($uploadNfs.subPath | default "") | quote }}
            {{- if ne $sigSecret "" }}
            - name: signing-keys
              mountPath: /keys
              readOnly: true
            {{- end }}
          env:
            - name: SOLR_HOST
              value: {{ ($hj.solrBaseUrl | default (printf "%s-solrcloud-common.%s" .Release.Name .Release.Namespace)) | quote }}
            - name: SOLR_USER
              value: {{ ($hj.adminUser | default "admin") | quote }}
            - name: SOLR_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $hj.adminPasswordSecretName | default (printf "%s-solrcloud-security-bootstrap" .Release.Name) | quote }}
                  key: {{ ($hj.adminPasswordSecretKey | default "admin") | quote }}
            - name: PACKAGE_NAME
              value: {{ $hj.packageName | default "biosolr" | quote }}
            - name: BIOSOLR_VERSION
              value: {{ $pkgVer | quote }}
            - name: BIOSOLR_JAR_PATH
              value: {{ ($upload.localJarPath | default "/input/biosolr.jar") | quote }}
            {{- if ne $sigSecret "" }}
            - name: SIGNING_PRIVATE_KEY
              value: {{ printf "/keys/%s" $sigPrivKey | quote }}
            - name: SIGNING_PUBLIC_KEY
              value: {{ printf "/keys/%s" $sigPubKey | quote }}
            {{- end }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              HOST=${SOLR_HOST:-"localhost:8983"}
              SOLR_USER=${SOLR_USER:-"solr"}
              SOLR_PASS=${SOLR_PASS:-"SolrRocks"}
              SOLR_AUTH="-u $SOLR_USER:$SOLR_PASS"
              CURL_OUT=/tmp/curl_out.txt

              [ -z "${BIOSOLR_JAR_PATH}" ] && echo "BIOSOLR_JAR_PATH env var is needed." && exit 1
              [ -z "${BIOSOLR_VERSION}" ] && echo "BIOSOLR_VERSION env var is needed." && exit 1

              curl_check() {
                echo "curl_check: $@"
                HTTP_STATUS=$(curl $SOLR_AUTH -s -w "%{http_code}" -o "$CURL_OUT" "$@")
                cat "$CURL_OUT"
                echo ""
              }

              echo "Checking if BioSolr package is already registered"
              curl_check "http://$HOST/api/cluster/package?omitHeader=true"
              if grep -q "${PACKAGE_NAME}" "$CURL_OUT"; then
                echo "BioSolr package is already registered."
                cat $CURL_OUT
                exit 0
              fi

              REMOTE_BIOSOLR_PATH=/biosolr/$BIOSOLR_VERSION/biosolr.jar
              echo "BIOSOLR_JAR_PATH: $BIOSOLR_JAR_PATH"
              if [ ! -s "$BIOSOLR_JAR_PATH" ]; then
                echo "BioSolr JAR does not exist or is empty at $BIOSOLR_JAR_PATH"
                exit 1
              fi

              # Upload public key to trusted store if signing key is available and key not yet present
              if [ -n "${SIGNING_PUBLIC_KEY}" ] && [ -f "${SIGNING_PUBLIC_KEY}" ]; then
                echo "Checking trusted key store..."
                curl_check "http://$HOST/api/node/files/_trusted_/keys?omitHeader=true"
                if ! grep -q '"name"' "$CURL_OUT"; then
                  echo "Uploading public key to trusted store..."
                  curl_check $SOLR_AUTH -X PUT \
                    --data-binary @"$SIGNING_PUBLIC_KEY" \
                    "http://$HOST/api/cluster/files/_trusted_/keys/package-store-key.der"
                  case "$HTTP_STATUS" in 2*) echo "Public key uploaded." ;;
                    *) echo "Failed to upload public key (HTTP $HTTP_STATUS) - continuing anyway" ;;
                  esac
                else
                  echo "Trusted keys already present."
                fi
              fi

              # Sign the JAR if a private key is available
              echo "SIGNING_PRIVATE_KEY: $SIGNING_PRIVATE_KEY"
              echo "SIGNING_PUBLIC_KEY: $SIGNING_PUBLIC_KEY"
              if [ -n "${SIGNING_PRIVATE_KEY}" ] && [ -f "${SIGNING_PRIVATE_KEY}" ]; then
                echo "Signing JAR..."
                SIGNATURE=$(openssl dgst -sha1 -sign "$SIGNING_PRIVATE_KEY" "$BIOSOLR_JAR_PATH" \
                  | openssl enc -base64 | sed 's/+/%2B/g' | tr -d '\n')
                echo "JAR signed."
                SIG_PARAM="?sig=$SIGNATURE"
              else
                echo "No signing key found, uploading without signature."
                SIG_PARAM=""
              fi

              echo "Uploading BioSolr JAR..."
              curl_check --data-binary @$BIOSOLR_JAR_PATH -X PUT \
                "http://$HOST/api/cluster/files${REMOTE_BIOSOLR_PATH}${SIG_PARAM}"
              case "$HTTP_STATUS" in 2*) ;; *)
                echo "Failed to upload JAR (HTTP $HTTP_STATUS)"
                # exit 1
                sleep 10000
              esac

              echo "Verifying JAR file..."
              curl_check "http://$HOST/api/node/files/biosolr/$BIOSOLR_VERSION/biosolr.jar?omitHeader=true"
              case "$HTTP_STATUS" in 2*) ;; *)
                echo "Could not verify BioSolr JAR (HTTP $HTTP_STATUS)"
                exit 1
              esac

              echo "Registering package..."
              curl_check "http://$HOST/api/cluster/package" -H 'Content-type:application/json' -d \
                "{\"add\":{\"package\":\"biosolr\",\"version\":\"$BIOSOLR_VERSION\",\"files\":[\"$REMOTE_BIOSOLR_PATH\"]}}"
              case "$HTTP_STATUS" in 2*) ;; *)
                echo "Failed to register package (HTTP $HTTP_STATUS)"
                exit 1
              esac

              echo "Verifying package registration..."
              curl_check "http://$HOST/api/cluster/package?omitHeader=true"
              case "$HTTP_STATUS" in 2*) ;; *)
                echo "Failed to verify package (HTTP $HTTP_STATUS)"
                exit 1
              esac

              echo "BioSolr package is ready."
{{- end }}
