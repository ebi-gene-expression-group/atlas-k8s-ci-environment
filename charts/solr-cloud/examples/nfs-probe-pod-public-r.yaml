# Interactive NFS probe: vlan157 /ifs/public-r root (hx-wp-webadmin-121).
# Apply:  kubectl --context fg-fallback apply -f charts/solr-cloud/examples/nfs-probe-pod-public-r.yaml
# Shell:  kubectl --context fg-fallback exec -it nfs-probe-public-r -n gxa-fallback -- sh
# Delete: kubectl --context fg-fallback delete -f charts/solr-cloud/examples/nfs-probe-pod-public-r.yaml
apiVersion: v1
kind: Pod
metadata:
  name: nfs-probe-public-r
  namespace: gxa-fallback
  labels:
    app: nfs-probe-public-r
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 2921
    runAsGroup: 1146
    fsGroup: 1146
  containers:
    - name: probe
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "NFS probe — hx-isi-srv-vlan157.ebi.ac.uk:/ifs/public-r -> /public-r"
          echo "User/group: $(id)"
          echo "=== startup checks ==="
          mount | grep nfs || true
          ls -la /public-r
          touch /public-r/.write-test 2>&1; echo "touch /public-r/.write-test exit:$?"
          echo "Examples:"
          echo "  ls -la /public-r"
          echo "  ls -la /public-r/services/fg/atlas/environments"
          echo "  touch /public-r/.write-test; echo exit:\$?"
          while true; do sleep 3600; done
      volumeMounts:
        - name: public-r
          mountPath: /public-r
      resources:
        requests:
          memory: 100Mi
          cpu: 100m
        limits:
          memory: 200Mi
          cpu: 200m
  volumes:
    - name: public-r
      nfs:
        server: hx-isi-srv-vlan157.ebi.ac.uk
        path: /ifs/public-r
