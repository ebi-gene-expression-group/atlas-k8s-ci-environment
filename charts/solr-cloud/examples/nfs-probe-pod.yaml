# Interactive NFS probe for staging migration paths.
# Apply: kubectl apply -f charts/solr-cloud/examples/nfs-probe-pod.yaml
# Shell:  kubectl exec -it nfs-probe -n gxa-staging-solrcloud -- sh
# Delete: kubectl delete -f charts/solr-cloud/examples/nfs-probe-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: nfs-probe
  namespace: gxa-staging-solrcloud
  labels:
    app: nfs-probe
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 2921
    runAsGroup: 1146
    fsGroup: 1146
  containers:
    - name: probe
      image: busybox:1.28.0-glibc
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "NFS probe — mounts under /staging, /solr-data, /zk-data"
          echo "User/group: $(id)"
          echo "Groups:     $(id -G)"
          echo "=== startup checks (set -x) ==="
          set -x
          mount | grep nfs
          ls -la /staging /solr-data /zk-data
          for path in /staging /solr-data /zk-data; do
            echo "touch ${path}/.write-test"
            touch "${path}/.write-test" 2>&1
            echo "touch ${path}/.write-test exit=$?"
          done
          set +x
          echo "Examples (interactive):"
          echo "  set -x"
          echo "  mount | grep nfs"
          echo "  ls -la /staging /solr-data /zk-data"
          echo "  touch /solr-data/.write-test 2>&1; echo exit:\$?"
          echo "  set +x"
          # busybox touch has no -v; use set -x and 2>&1 for verbose output
          while true; do sleep 3600; done
      volumeMounts:
        - name: staging
          mountPath: /staging
        - name: solr-data
          mountPath: /solr-data
        - name: zk-data
          mountPath: /zk-data
      resources:
        requests:
          memory: 100Mi
          cpu: 100m
        limits:
          memory: 200Mi
          cpu: 200m
  volumes:
    - name: staging
      nfs:
        server: hh-isi-srv-vlan1496.ebi.ac.uk
        path: /ifs/public/rw/fg/atlas/gxa/environments/staging
    - name: solr-data
      nfs:
        server: hh-isi-srv-vlan1496.ebi.ac.uk
        path: /ifs/public/rw/fg/atlas/gxa/environments/staging/solr_data
    - name: zk-data
      nfs:
        server: hh-isi-srv-vlan1496.ebi.ac.uk
        path: /ifs/public/rw/fg/atlas/gxa/environments/staging/zk_data
