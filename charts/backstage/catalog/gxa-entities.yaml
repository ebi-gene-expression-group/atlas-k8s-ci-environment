# Gene Expression Atlas — Backstage catalog (spike).
# One Component per env: Links for one-click access; dependsOn → Resources (Postgres/Solr/NFS).
# NFS server from charts/gxa/values.yaml and charts/solr-cloud/values.yaml (nfs.server).
# Topology source: config/gxa-environments.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: fg_team
  title: Functional Genomics
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: gxa
  title: Gene Expression Atlas
  description: GXA webapp + SolrCloud + Postgres across ci / staging / public / fallback
spec:
  owner: fg_team
---
# JSON HTTP API provided by the GXA webapp (context path /gxa).
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: gxa-json
  title: GXA JSON API
  description: >
    GXA endpoints under /gxa —
    JSON experiments list/detail, health, build info, and experiment zip download.
  tags:
    - gxa
    - json
  annotations:
    # Enables the catalog table "View" action (opens this URL).
    backstage.io/view-url: http://hh-rke-wp-webadmin-35-worker-1.caas.ebi.ac.uk:31506/gxa/json/experiments
spec:
  type: openapi
  lifecycle: production
  owner: fg_team
  system: gxa
  definition: |
    openapi: 3.0.3
    info:
      title: GXA JSON API
      version: "1.0"
      description: Gene Expression Atlas endpoints (served under context path /gxa).
    servers:
      - url: http://hh-rke-wp-webadmin-35-worker-1.caas.ebi.ac.uk:31506/gxa
        description: public (hh-wp-webadmin-35)
      - url: http://hh-rke-wp-webadmin-35-worker-1.caas.ebi.ac.uk:30932/gxa
        description: staging (hh-wp-webadmin-35)
      - url: http://hh-rke-wp-webadmin-35-worker-1.caas.ebi.ac.uk:31463/gxa
        description: ci (hh-wp-webadmin-35)
      - url: http://hx-rke-wp-webadmin-25-worker-1.caas.ebi.ac.uk:31622/gxa
        description: fallback (hx-wp-webadmin-25)
    paths:
      /json/experiments:
        get:
          summary: List experiments
          operationId: listExperiments
          responses:
            "200":
              description: Experiment list JSON
      /json/experiments/{accession}:
        get:
          summary: Experiment by accession
          operationId: getExperiment
          parameters:
            - name: accession
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Experiment JSON
      /experiments/download/zip:
        get:
          summary: Download experiments as zip
          operationId: downloadExperimentsZip
          description: >
            Download one or more experiments as a zip archive.
            Repeat the accession query parameter for each accession
            (e.g. ?accession=E-MTAB-1&accession=E-MTAB-2).
          parameters:
            - name: accession
              in: query
              required: true
              description: Experiment accession(s); repeat for multiple
              schema:
                type: array
                items:
                  type: string
                minItems: 1
              style: form
              explode: true
          responses:
            "200":
              description: Zip archive of experiment files
              content:
                application/zip:
                  schema:
                    type: string
                    format: binary
      /json/health:
        get:
          summary: Health check
          operationId: health
          responses:
            "200":
              description: Healthy
      /json/build:
        get:
          summary: Build / version info
          operationId: build
          responses:
            "200":
              description: Build metadata JSON
