# Annotare — Backstage catalog (spike).
# Staging/public webapps, MySQL (host/user only — passwords in OpenBao / ops secrets),
# NFS upload paths, submission pipelines.
# Do not commit DB passwords here.
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: annotare
  title: Annotare
  description: Annotare submission UI and related MySQL, NFS upload paths, and Jenkins pipelines
spec:
  owner: fg_team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: annotare-staging
  title: Annotare (staging)
  description: Annotare staging / wwwdev — https://wwwdev.ebi.ac.uk/fg/annotare
  tags:
    - annotare
    - staging
  annotations:
    ebi.ac.uk/gxa-environment: staging
    backstage.io/view-url: https://wwwdev.ebi.ac.uk/fg/annotare
  links:
    - url: https://wwwdev.ebi.ac.uk/fg/annotare
      title: Webapp (Home)
      icon: dashboard
    - url: mysql://mysql-annotare-dev.ebi.ac.uk:4420/ae_annotare2
      title: "MySQL — mysql-annotare-dev.ebi.ac.uk:4420/ae_annotare2 (annotare)"
      icon: storage
    - url: file:///nfs/ftp/private/annotare/dev
      title: "NFS FTP upload — /nfs/ftp/private/annotare/dev"
      icon: storage
    - url: file:///nfs/public/rw/fg/annotare/an2dev_home/upload
      title: "NFS upload — /nfs/public/rw/fg/annotare/an2dev_home/upload"
      icon: storage
spec:
  type: website
  lifecycle: staging
  owner: fg_team
  system: annotare
  dependsOn:
    - resource:default/annotare-mysql-dev
    - resource:default/annotare-nfs-ftp-upload
    - resource:default/annotare-nfs-upload
    - component:default/annotare-submission-status-poller
    - component:default/annotare-submission-file-validation
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: annotare-public
  title: Annotare (public)
  description: Annotare public / www — https://www.ebi.ac.uk/fg/annotare
  tags:
    - annotare
    - public
  annotations:
    ebi.ac.uk/gxa-environment: public
    backstage.io/view-url: https://www.ebi.ac.uk/fg/annotare
  links:
    - url: https://www.ebi.ac.uk/fg/annotare
      title: Webapp (Home)
      icon: dashboard
    - url: mysql://mysql-annotare-prod.ebi.ac.uk:4444/annotare2
      title: "MySQL — mysql-annotare-prod.ebi.ac.uk:4444/annotare2 (annotare)"
      icon: storage
    - url: mysql://mysql-annotare-prod.ebi.ac.uk:4444/annotare2
      title: "MySQL RO — mysql-annotare-prod.ebi.ac.uk:4444/annotare2 (readonly)"
      icon: storage
spec:
  type: website
  lifecycle: public
  owner: fg_team
  system: annotare
  dependsOn:
    - resource:default/annotare-mysql-prod
    - resource:default/annotare-mysql-prod-readonly
    - component:default/annotare-submission-status-poller
    - component:default/annotare-submission-file-validation
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: annotare-submission-status-poller
  title: Annotare — submission status poller
  description: Jenkins / batch pipeline that polls Annotare submission status
  tags:
    - annotare
    - pipeline
spec:
  type: service
  lifecycle: production
  owner: fg_team
  system: annotare
---
apiVersion: backstage.io/v1alpha1
