{{- if and .Values.solr .Values.solr.bioentities.populator .Values.solr.bioentities.populator.enabled | default false -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: bioentities-populator
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      volumes:
        {{- include "app.secretsVolume" . | nindent 8 }}
        {{- include "app.bioentitiesJsonlVolume" . | nindent 8 }}
        - name: solr-config
          configMap:
            name: {{ include "app.fullname" . }}-config
      containers:
        - name: {{ include "app.name" . }}-solrcloud-populator
          image: openjdk:11
          env:
            - name: JAVA_TOOLS_OPTIONS
              value: "-Dfile.encoding=UTF-8 -Dsolr.httpclient.builder.factory=org.apache.solr.client.solrj.impl.PreemptiveBasicAuthClientBuilderFactory -Dbasicauth=\"${SOLR_USER}:${SOLR_PASS}\""
            {{- include "app.proxyEnv" . | nindent 12 }}
            # From Secret (sensitive credentials)
            - name: SOLR_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.fullname" . }}-secrets
                  key: SOLR_USER
            - name: SOLR_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.fullname" . }}-secrets
                  key: SOLR_PASS
            # From ConfigMap (non-sensitive configuration)
            - name: SOLR_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "app.fullname" . }}-config
                  key: SOLR_HOST
            - name: SOLR_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "app.fullname" . }}-config
                  key: SOLR_HOST
            - name: SOLR_ZK_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "app.fullname" . }}-config
                  key: SOLR_ZK_HOSTS
            - name: SOLR_COLLECTION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "app.fullname" . }}-config
                  key: SOLR_BIOENTITIES_COLLECTION
            - name: SOLR_NUM_SHARDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "app.fullname" . }}-config
                  key: SOLR_NUM_SHARDS
            - name: SOLR_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "app.fullname" . }}-config
                  key: SOLR_TIMEOUT
            # Job-specific environment variables
            - name: NUM_DOCS_PER_BATCH
              value: "20000"
            - name: SCHEMA_VERSION
              value: "1"
            - name: GIT_BRANCH
              value: {{ .Values.solr.bioentities.populator.gitBranch | default "develop" | quote }}
          resources:
            requests:
              cpu: "1"
              memory: 500Mi
            limits:
              cpu: "1"
              memory: 1Gi
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ev
              mkdir /work

              cd /work

              git clone --recurse-submodules --depth 1 --single-branch --branch ${GIT_BRANCH} https://github.com/ebi-gene-expression-group/index-bioentities.git

              cd index-bioentities/bin
              ./create-bioentities-collection.sh
              ./create-bioentities-schema.sh
              ./create-bioentities-suggesters.sh

              for FILE in `ls {{ include "app.bioentitiesJsonlDir" . }}/*.jsonl`
              do
                echo "Processing jsonlfile: ${FILE}"
                INPUT_JSONL=${FILE} ./solr-jsonl-chunk-loader.sh >> /dev/stdout 2>&1
              done
              ./build-suggesters.sh
          volumeMounts:
            - mountPath: "{{ include "app.bioentitiesJsonlDir" . }}"
              name: bioentities-jsonl-vol
            - mountPath: /etc/solr
              name: solr-config
              readOnly: true
      initContainers:
        - name: wait-for-previous-job
          image: dtzar/helm-kubectl:3.16.2
          command: ["kubectl"]
          args:
          - "wait"
          - "--for=condition=complete"
          - "--timeout=1h"
          - "job/bioentities-jsonl"
      restartPolicy: Never
{{- end }}