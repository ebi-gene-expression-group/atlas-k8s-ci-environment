# Default values for mongodb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: mongo
  tag: "6.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 27017

auth:
  rootUsername: admin
  rootPassword: ""  # Set via MONGODB_ROOT_PASSWORD environment variable or .env file
  database: ""  # Optional: database to create
  username: ""  # Optional: additional user
  password: ""  # Optional: password for additional user

persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClass: ""  # Use default storage class if not specified
  existingClaim: ""  # Use existing PVC if specified

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

securityContext: {}

mongoimport:
  enabled: false
  image:
    repository: mongo
    tag: "6.0"
    pullPolicy: IfNotPresent
  jsonlSource:
    pvcName: ""  # Name of the PVC containing JSONL files (e.g., bulk-analytics-jsonl-rwm)
    mountPath: "/data/jsonl"  # Mount path for the JSONL files
  collection: "bulk_analytics"  # MongoDB collection name
  drop: false  # Drop collection before importing
  upsert: false  # Use upsert mode
  upsertFields: ""  # Comma-separated list of fields for upsert (e.g., "_id,experiment_accession")
  backoffLimit: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

