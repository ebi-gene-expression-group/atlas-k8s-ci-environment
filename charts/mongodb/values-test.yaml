mongodb:
  resources:
    requests:
      memory: 1Gi
      cpu: 100m
    limits:
      memory: 2Gi
      cpu: 250m

  persistence:
    size: 5Gi

importJob:
  enabled: false
  parallelism: 2
  species:
    - homo_sapiens
    - drosophila_melanogaster
    - gallus_gallus
    - danio_rerio

# ── Solr → MongoDB export (solrExportJob*) ─────────────────────────────────
#
# `collections` is a list of Solr **collection aliases** (recommended) or physical
# collection names used in the URL path `/solr/<name>/…`.
# Prefer aliases — they are stable and omit the `-vN` schema suffix.
# One list entry = one indexed Job completion = one export target.
# MongoDB collection name matches that string unless mongoCollectionName / stripVersionSuffix
# is set (see values.yaml).
#
# Run each profile with the task (Solr namespace is injected automatically):
#   task mongodb-solr-export RELEASE=scxa ENV=test EXPORT_JOB=bioentities     SOLR_NAMESPACE=scxa-dev-solrcloud
#   task mongodb-solr-export RELEASE=scxa ENV=test EXPORT_JOB=gene2experiment SOLR_NAMESPACE=scxa-dev-solrcloud
#   task mongodb-solr-export RELEASE=scxa ENV=test EXPORT_JOB=analytics       SOLR_NAMESPACE=scxa-dev-solrcloud
#   task mongodb-solr-export RELEASE=scxa ENV=test EXPORT_JOB=scxa-pair       SOLR_NAMESPACE=scxa-dev-solrcloud  # gene2experiment + analytics (one Job, 2 completions)
#
# Progress (two containers in each Pod):
#   kubectl logs -n NAMESPACE POD -c solr-export -f    # [export] batch …  N/total docs (pct%)
#   kubectl logs -n NAMESPACE POD -c mongoimport -f      # mongoimport --verbose
#
# Per-species Solr cores (homo_sapiens-bioentities, …) merged into one Mongo collection:
# list each name in `collections` and set mongoCollectionName — see values.yaml.

# ── bioentities ───────────────────────────────────────────────────────────
# Solr alias → Mongo `atlas.bioentities`.
# Single cursor over the whole alias — no partitionField (no experiment sharding).
solrExportJobBioentities:
  enabled: false
  collections:
    - bioentities
  parallelism: 1
  batchSize: 50000
  partitionField: ""           # explicit: non-partitioned export
  mongoimportVerbose: true
  importMode: insert
  dropCollection: true
  numInsertionWorkers: 4
  solr:
    user: admin
    secretKey: admin
  exportResources:
    requests: { memory: 512Mi, cpu: 500m }
    limits:   { memory: 2Gi, cpu: 1 }
  importResources:
    requests: { memory: 256Mi, cpu: 1000m }
    limits:   { memory: 512Mi, cpu: 1 }

# ── scxa-gene2experiment ──────────────────────────────────────────────────
# Solr alias (not the physical `…-v1` collection); Mongo name matches alias.
solrExportJobGene2experiment:
  enabled: false
  collections:
    - scxa-gene2experiment
  parallelism: 1
  batchSize: 50000
  partitionField: experiment_accession
  maxWorkers: 8
  importMode: insert
  dropCollection: true
  numInsertionWorkers: 4
  solr:
    user: admin
    secretKey: admin
  exportResources:
    requests: { memory: 1Gi, cpu: 500m }
    limits:   { memory: 3Gi, cpu: 1 }
  importResources:
    requests: { memory: 256Mi, cpu: 1500m }
    limits:   { memory: 512Mi, cpu: 2 }

# ── scxa-analytics ────────────────────────────────────────────────────────
solrExportJobAnalytics:
  enabled: false
  collections:
    - scxa-analytics
  parallelism: 1
  batchSize: 50000
  partitionField: experiment_accession
  maxWorkers: 8
  importMode: insert
  dropCollection: true
  numInsertionWorkers: 4
  solr:
    user: admin
    secretKey: admin
  exportResources:
    requests: { memory: 1Gi, cpu: 500m }
    limits:   { memory: 3Gi, cpu: 1 }
  importResources:
    requests: { memory: 256Mi, cpu: 1500m }
    limits:   { memory: 512Mi, cpu: 2 }

# ── scxa-gene2experiment + scxa-analytics (single indexed Job, parallelism 2) ──
solrExportJobScxaPair:
  enabled: false
  collections:
    - scxa-gene2experiment
    - scxa-analytics
  parallelism: 2
  batchSize: 50000
  partitionField: experiment_accession
  maxWorkers: 8
  importMode: insert
  dropCollection: true
  numInsertionWorkers: 4
  mongoimportVerbose: true
  solr:
    user: admin
    secretKey: admin
  exportResources:
    requests: { memory: 1Gi, cpu: 500m }
    limits:   { memory: 3Gi, cpu: 1 }
  importResources:
    requests: { memory: 256Mi, cpu: 1500m }
    limits:   { memory: 512Mi, cpu: 2 }
