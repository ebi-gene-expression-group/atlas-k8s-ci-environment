{{- $job := .Values.solrExportJob | default dict -}}
{{- if $job.enabled | default false }}
{{- $solr        := $job.solr   | default dict -}}
{{- $mongo       := $job.mongo  | default dict -}}
{{- $mongoHost   := $mongo.host | default (printf "%s-mongodb.%s.svc.cluster.local" .Release.Name .Release.Namespace) -}}
{{- $secretName  := $mongo.secretName | default (include "mongodb.fullname" .) -}}
{{- $secretKey   := $mongo.secretKey  | default "mongodb-root-password" -}}
{{- $collections := $job.collections  | default list -}}
{{- if eq (len $collections) 0 -}}
{{- fail "solrExportJob.collections must be a non-empty list" -}}
{{- end }}
{{- $count := len $collections -}}
# Streaming Solr → MongoDB export — runs entirely inside the cluster.
#
# Each indexed completion handles one entry from solrExportJob.collections
# (Solr alias or collection name — used as /solr/<name>/…):
#
#   initContainers:
#     resolve-collection  (busybox)      — picks collection name by index, creates FIFO
#   containers (run CONCURRENTLY in the same Pod):
#     solr-export         (python:3-slim) — exports to /shared/export.fifo
#       Simple mode     : cursor-paginates the whole collection
#       Partitioned mode: discovers partitions via Solr facets, exports with MAX_WORKERS threads
#     mongoimport         (mongo image)   — reads FIFO, writes to MongoDB
#
# No port-forwarding needed — all network traffic stays within the cluster.
# No disk needed — data streams through a FIFO directly from Solr to MongoDB.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-solr-export
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: solr-export
    {{- include "mongodb.labels" . | nindent 4 }}
spec:
  completions: {{ $count }}
  parallelism: {{ $job.parallelism | default $count }}
  completionMode: Indexed
  backoffLimit: {{ $job.backoffLimit | default 1 }}
  ttlSecondsAfterFinished: {{ $job.ttlSecondsAfterFinished | default 600 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: solr-export
        {{- include "mongodb.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      volumes:
        - name: shared
          emptyDir: {}
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-solr-export-script
            defaultMode: 0755
      initContainers:
        - name: resolve-collection
          image: busybox
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared
              mountPath: /shared
          env:
            - name: COLLECTIONS_LIST
              value: {{ join "," $collections | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              COL=$(echo "$COLLECTIONS_LIST" | tr ',' '\n' | sed -n "$((JOB_COMPLETION_INDEX + 1))p")
              if [ -z "$COL" ]; then
                echo "ERROR: no entry at index ${JOB_COMPLETION_INDEX}"
                exit 1
              fi
              echo "Index ${JOB_COMPLETION_INDEX} → ${COL}  (Solr alias or collection)"
              echo -n "$COL" > /shared/collection
              mkfifo /shared/export.fifo
              echo "Ready."

      containers:
        # ── Writer: Solr → FIFO ───────────────────────────────────────────────
        - name: solr-export
          image: python:3-slim
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: scripts
              mountPath: /scripts
          env:
            - name: SOLR_HOST
              value: {{ required "solrExportJob.solr.host is required" $solr.host | quote }}
            - name: SOLR_USER
              value: {{ $solr.user | default "admin" | quote }}
            - name: SOLR_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "solrExportJob.solr.secretName is required" $solr.secretName | quote }}
                  key: {{ $solr.secretKey | default "admin" | quote }}
            - name: BATCH_SIZE
              value: {{ $job.batchSize | default 50000 | quote }}
            - name: SOLR_QUERY
              value: {{ $job.query | default "*:*" | quote }}
            - name: STRIP_FIELDS
              value: {{ $job.stripFields | default "_version_" | quote }}
            # When set, the script auto-discovers all values of this field via Solr
            # facets and exports each value's documents concurrently using MAX_WORKERS
            # threads — recommended for large collections (analytics, gene2experiment).
            - name: PARTITION_FIELD
              value: {{ $job.partitionField | default "" | quote }}
            - name: MAX_WORKERS
              value: {{ $job.maxWorkers | default 8 | quote }}
            - name: SOLR_HTTP_TIMEOUT
              value: {{ $job.solrHttpTimeout | default 600 | quote }}
          resources:
            {{- toYaml ($job.exportResources | default dict) | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export SOLR_COLLECTION=$(cat /shared/collection)
              echo "Starting export from Solr path /solr/'${SOLR_COLLECTION}'/… (partition_field='${PARTITION_FIELD}')"
              python3 /scripts/export.py

        # ── Reader: FIFO → MongoDB ────────────────────────────────────────────
        - name: mongoimport
          image: {{ $job.mongoImage | default (printf "mongo:%s" .Chart.AppVersion) | quote }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared
              mountPath: /shared
          env:
            - name: MONGO_HOST
              value: {{ $mongoHost | quote }}
            - name: MONGO_PORT
              value: {{ $mongo.port | default 27017 | quote }}
            - name: MONGO_DB
              value: {{ $mongo.database | default "atlas" | quote }}
            - name: MONGO_USER
              value: {{ $mongo.username | default "root" | quote }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName | quote }}
                  key: {{ $secretKey | quote }}
            - name: IMPORT_MODE
              value: {{ $job.importMode | default "insert" | quote }}
            - name: UPSERT_FIELDS
              value: {{ $job.upsertFields | default "id" | quote }}
            - name: DROP_COLLECTION
              value: {{ $job.dropCollection | default false | quote }}
            - name: NUM_INSERTION_WORKERS
              value: {{ $job.numInsertionWorkers | default 4 | quote }}
            - name: MONGOIMPORT_VERBOSE
              value: {{ $job.mongoimportVerbose | default true | quote }}
          resources:
            {{- toYaml ($job.importResources | default dict) | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until [ -p /shared/export.fifo ]; do sleep 1; done

              SOLR_COLLECTION=$(cat /shared/collection)
              {{- if $job.mongoCollectionName }}
              MONGO_COLLECTION={{ $job.mongoCollectionName | quote }}
              {{- else if $job.stripVersionSuffix }}
              MONGO_COLLECTION=$(echo "$SOLR_COLLECTION" | sed 's/-v[0-9]*$//')
              {{- else }}
              MONGO_COLLECTION="$SOLR_COLLECTION"
              {{- end }}

              # URI without userinfo — passwords from Bitnami often contain @ * : / etc. which break mongodb://user:pass@…
              URI_BASE="mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}?authSource=admin"
              echo "[import] starting mongoimport → ${MONGO_DB}.${MONGO_COLLECTION}  mode=${IMPORT_MODE}  workers=${NUM_INSERTION_WORKERS}"
              echo "[import] $(mongoimport --version 2>&1 | head -n 1)"
              echo "[import] source=FIFO /shared/export.fifo  sink=${URI_BASE}  collection=${MONGO_COLLECTION}"

              # Build argv without bash arrays: this container uses /bin/sh (often dash), not bash.
              # Pattern: "set --" assigns $1,$2,…; "set -- "$@" --flag" appends; "$@" runs $1 with $2… as args.
              # Same idea as bash's args=(…) / "${args[@]}" — portable for POSIX sh (see sh(1) set, search for --).
              set -- mongoimport \
                --uri "$URI_BASE" \
                --username "$MONGO_USER" \
                --password "$MONGO_PASSWORD" \
                --collection "$MONGO_COLLECTION" \
                --type json \
                --mode "$IMPORT_MODE" \
                --numInsertionWorkers "$NUM_INSERTION_WORKERS" \
                --file /shared/export.fifo
              if [ "$IMPORT_MODE" != "insert" ]; then
                set -- "$@" --upsertFields "$UPSERT_FIELDS"
              fi
              if [ "$DROP_COLLECTION" = "true" ]; then
                set -- "$@" --drop
              fi
              if [ "$MONGOIMPORT_VERBOSE" = "true" ]; then
                set -- "$@" --verbose
              fi
              "$@"   # exec mongoimport with the args built above
              rc=$?
              echo "[import] mongoimport finished with exit code ${rc}"
              exit "${rc}"
{{- end }}
