apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  mongodb-root-password: {{ required "mongodb.auth.rootPassword is required" .Values.mongodb.auth.rootPassword | quote }}
  mongodb-passwords: {{ join "," .Values.mongodb.auth.passwords | quote }}
  # Individual user passwords by username for convenience
  {{- range $i, $user := .Values.mongodb.auth.usernames }}
  {{ $user }}: {{ index $.Values.mongodb.auth.passwords $i | quote }}
  {{- end }}
