apiVersion: v1
kind: Service
metadata:
  name: {{ include "gxa.fullname" . }}
  labels:
    {{- include "gxa.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      nodePort: {{ .Values.service.nodePort}}
  selector:
    {{- include "gxa.selectorLabels" . | nindent 4 }}
