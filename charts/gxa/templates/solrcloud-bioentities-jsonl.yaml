{{- if and .Values.solr .Values.solr.bioentities.jsonl (.Values.solr.bioentities.jsonl.enabled | default false) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bioentities-jsonl-rwo
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  storageClassName: standard-nfs-production 
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bioentities-jsonl
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      volumes:
        {{- include "app.servicesVolume" . | nindent 8 }}
        {{- include "app.secretsVolume" . | nindent 8 }}
        {{- include "app.gxaCodonVolume" . | nindent 8 }}
        {{- include "app.bioentitiesJsonlVolume" . | nindent 8 }}
        - name: bioentity-properties-volume
          emptyDir: {}
        - name: webapp-volume
          emptyDir: {}
      containers:
        - name: {{ include "app.name" . }}-solrcloud-bioentities-jsonl
          image: openjdk:11
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Dfile.encoding=UTF8"
            {{- include "app.proxyEnv" . | nindent 12 }}
            - name: SPECIES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "app.fullname" . }}-config
                  key: species
          resources:
            requests:
              cpu: 1
              memory: 6Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: 1
              memory: 8Gi
          command: ["/bin/bash", "-c"]
          args:
            - |
              # set -e
              git clone --recurse-submodules --depth 1 --single-branch https://github.com/ebi-gene-expression-group/atlas-web-bulk.git
              cp /secrets/jdbc.properties \
                 /atlas-web-bulk/cli/src/main/resources/

              # link required files to app.bioentityPropertiesSourceDir directory
              for BIOENTITY_SUBDIR in annotations array_designs reactome
              do
                for _SPECIES in ${SPECIES}
                do
                  echo "processing: ${BIOENTITY_SUBDIR} for species: ${_SPECIES}"
                  cd {{ include "app.bioentityPropertiesSourceDir" . }}
                  mkdir -pv {{ include "app.bioentityPropertiesDir" . }}/${BIOENTITY_SUBDIR}
                  find . -type f | grep ${_SPECIES} | grep ${BIOENTITY_SUBDIR} \
                    | xargs -I{} \
                        ln -s {{ include "app.bioentityPropertiesSourceDir" . }}/{} \
                              {{ include "app.bioentityPropertiesDir" . }}/{}
                done
              done

              cd /atlas-web-bulk
              ./gradlew --no-watch-fs \
              {{ include "app.gradleCliArgs" . | indent 14 }} \
              -PdataFilesLocation={{ include "app.dataDir" . }} \
              -PexperimentDesignLocation={{ include "app.bioentityPropertiesDir" . }} \
              -PexperimentFilesLocation={{ include "app.experimentsDir" . }} \
              :cli:bootRun --args="bioentities-json --output={{ include "app.bioentitiesJsonlDir" . }}"
              
              # sleep for 5000 seconds to allow the job to be debugged if needed
              sleep 5000
          volumeMounts:
            # this is the volume where the bioentity_properties files are stored
            # a subset of files are linked to the root directory
            - mountPath: "{{ include "app.bioentityPropertiesSourceDir" . }}"
              name: services-volume
              subPath: "fg/atlas/bioentity_properties"
              readOnly: true
            # this is the output directory where the jsonl files are written to
            - mountPath: "{{ include "app.bioentitiesJsonlDir" . }}"
              name: bioentities-jsonl-vol
            # this is the secrets volume where the jdbc.properties file is stored
            - name: {{ include "app.name" . }}-secrets
              mountPath: /secrets/jdbc.properties
              subPath: jdbc.properties
            - mountPath: "{{ include "app.bioentityPropertiesDir" . }}"
              name: bioentity-properties-volume
            - name: {{ include "app.name" . }}-codon-volume
              mountPath: "{{ include "app.experimentsDir" . }}/species-properties.json"
              subPath: species-properties.json  
              readOnly: true
            - name: webapp-volume
              mountPath: /atlas-web-bulk
      restartPolicy: Never
{{- end }}