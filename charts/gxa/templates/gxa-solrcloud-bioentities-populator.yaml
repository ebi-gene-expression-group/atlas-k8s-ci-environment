{{- if and .Values.solr .Values.solr.bioentitiesPopulator .Values.solr.bioentitiesPopulator.enabled | default false -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: bioentities-populator
spec:
  template:
    spec:
      volumes:
        - name: {{ include "app.name" . }}-bioentities-jsonl-vol
          persistentVolumeClaim:
            claimName: {{ include "app.name" . }}-bioentities-jsonl-rwo
      containers:
        - name: {{ include "app.name" . }}-solrcloud-populator
          image: openjdk:11
          env:
            - name: SOLR_HOST
              value: "{{ include "app.name" . }}-solrcloud-0.{{ include "app.name" . }}-solrcloud-headless.jenkins-gene-expression.svc.cluster.local:8983"
            - name: SOLR_HOSTS
              value: "{{ include "app.name" . }}-solrcloud-0.{{ include "app.name" . }}-solrcloud-headless.jenkins-gene-expression.svc.cluster.local:8983 {{ include "app.name" . }}-solrcloud-1.{{ include "app.name" . }}-solrcloud-headless.jenkins-gene-expression.svc.cluster.local:8983 {{ include "app.name" . }}-solrcloud-2.{{ include "app.name" . }}-solrcloud-headless.jenkins-gene-expression.svc.cluster.local:8983 {{ include "app.name" . }}-solrcloud-3.{{ include "app.name" . }}-solrcloud-headless.jenkins-gene-expression.svc.cluster.local:8983"
            - name: SOLR_NUM_SHARDS
              value: "4"
            - name: NUM_DOCS_PER_BATCH
              value: "20000"
            - name: SOLR_COLLECTION
              value: "bioentities"
            - name: SCHEMA_VERSION
              value: "1"
          resources:
            requests:
              cpu: 0.1
              memory: 32Mi
            limits:
              cpu: 0.25
              memory: 64Mi
          command: ["/bin/bash", "-c"]
          args:
            - |
              apt-get install -y --no-install-recommends git
              
              mkdir /work
              
              cd /work
              
              git clone --recurse-submodules --depth 1 --single-branch https://github.com/ebi-gene-expression-group/index-bioentities.git
  
              cd index-bioentities/bin
              ./create-bioentities-collection.sh
              ./create-bioentities-schema.sh
              ./create-bioentities-suggesters.sh

              for FILE in `ls /atlas-data/bioentities-jsonl/*.jsonl`
              do
                INPUT_JSONL=${FILE} ./solr-jsonl-chunk-loader.sh >> /dev/stdout 2>&1
              done
              ./build-suggesters.sh
          volumeMounts:
            - mountPath: "/atlas-data/bioentities-jsonl"
              name: {{ include "app.name" . }}-bioentities-jsonl-vol
      restartPolicy: Never
{{- end }}