{{- if .Values.imagePullSecret.create }}
{{- $name := include "app.registryPullSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $ours := false -}}
{{- if $existing -}}
{{- $labels := default dict $existing.metadata.labels -}}
{{- $anns := default dict $existing.metadata.annotations -}}
{{- $ours = and
      (eq (index $labels "app.kubernetes.io/managed-by" | default "") "Helm")
      (eq (index $anns "meta.helm.sh/release-name" | default "") .Release.Name)
      (eq (index $anns "meta.helm.sh/release-namespace" | default "") .Release.Namespace)
-}}
{{- end -}}
{{- /* Do not adopt platform-secrets (or any other) gxa-registry; Helm cannot import it. */ -}}
{{- if or (not $existing) $ours }}
{{- $server := required "imagePullSecret.server is required when imagePullSecret.create is true" .Values.imagePullSecret.server -}}
{{- $user := required "imagePullSecret.username is required when imagePullSecret.create is true" .Values.imagePullSecret.username -}}
{{- $pass := required "imagePullSecret.password is required when imagePullSecret.create is true" .Values.imagePullSecret.password -}}
{{- $authB64 := printf "%s:%s" $user $pass | b64enc -}}
{{- $creds := dict "auth" $authB64 -}}
{{- $auths := dict $server $creds -}}
{{- $doc := dict "auths" $auths -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $doc | toJson | quote }}
{{- end }}
{{- end }}
