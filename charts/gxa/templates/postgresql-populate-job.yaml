{{- if and .Values.postgresql.enabled .Values.postgresql.populate.enabled }}
{{- /*
  Plain (non-hook) Job: helm does not wait on it, so a large load does not block
  or fail the release. It streams pg_dump from the source straight into psql on
  the target (no intermediate .sql file). Runs once; to re-populate, delete this
  Job and re-deploy (or `kubectl delete job {{ include "app.fullname" . }}-pg-populate`).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" . }}-pg-populate
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: pg-populate
spec:
  backoffLimit: {{ .Values.postgresql.populate.backoffLimit | default 1 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pg-populate
    spec:
      restartPolicy: Never
      containers:
        - name: pg-populate
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          env:
            - name: SRC_HOST
              value: {{ required "postgresql.populate.source.host is required when populate.enabled=true" .Values.postgresql.populate.source.host | quote }}
            - name: SRC_PORT
              value: {{ .Values.postgresql.populate.source.port | default 5432 | quote }}
            - name: SRC_DB
              value: {{ required "postgresql.populate.source.database is required when populate.enabled=true" .Values.postgresql.populate.source.database | quote }}
            - name: SRC_USER
              value: {{ .Values.postgresql.populate.source.user | default "atlasprd3" | quote }}
            - name: SOURCE_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.fullname" . }}-postgresql
                  key: SOURCE_PG_PASSWORD
            - name: TGT_HOST
              value: {{ include "app.postgresqlHost" . | quote }}
            - name: TGT_PORT
              value: {{ .Values.postgresql.service.port | quote }}
            - name: TGT_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: ATLASDATALOAD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.fullname" . }}-postgresql
                  key: ATLASDATALOAD_PASSWORD
            - name: DUMP_ARGS
              value: {{ .Values.postgresql.populate.dumpArgs | default "--no-owner --no-privileges --clean --if-exists" | quote }}
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Waiting for target ${TGT_HOST}:${TGT_PORT} to be ready ..."
              until pg_isready -h "${TGT_HOST}" -p "${TGT_PORT}" -U atlasdataload -d "${TGT_DB}"; do
                sleep 2
              done
              echo "Streaming pg_dump from ${SRC_HOST}:${SRC_PORT}/${SRC_DB} (as ${SRC_USER}) into ${TGT_HOST}/${TGT_DB} (as atlasdataload) ..."
              # psql (target) reads PGPASSWORD from the environment; pg_dump (source)
              # gets its own PGPASSWORD scoped to that command in the pipeline.
              export PGPASSWORD="${ATLASDATALOAD_PASSWORD}"
              PGPASSWORD="${SOURCE_PG_PASSWORD}" pg_dump \
                -h "${SRC_HOST}" -p "${SRC_PORT}" -U "${SRC_USER}" -d "${SRC_DB}" \
                ${DUMP_ARGS} \
                | psql -v ON_ERROR_STOP=1 -h "${TGT_HOST}" -p "${TGT_PORT}" -U atlasdataload -d "${TGT_DB}"
              echo "Granting read-only access on restored schemas to atlasprd3 ..."
              # The dump may create schemas beyond public (e.g. atlasprd3, atlasprd3_ref),
              # owned by atlasdataload. Grant the read-only role USAGE + SELECT on each.
              psql -v ON_ERROR_STOP=1 -h "${TGT_HOST}" -p "${TGT_PORT}" -U atlasdataload -d "${TGT_DB}" <<'SQL'
              DO $$
              DECLARE s text;
              BEGIN
                FOR s IN SELECT nspname FROM pg_namespace WHERE nspowner = 'atlasdataload'::regrole LOOP
                  EXECUTE format('GRANT USAGE ON SCHEMA %I TO atlasprd3', s);
                  EXECUTE format('GRANT SELECT ON ALL TABLES IN SCHEMA %I TO atlasprd3', s);
                  EXECUTE format('GRANT SELECT ON ALL SEQUENCES IN SCHEMA %I TO atlasprd3', s);
                  EXECUTE format('ALTER DEFAULT PRIVILEGES IN SCHEMA %I GRANT SELECT ON TABLES TO atlasprd3', s);
                END LOOP;
              END $$;
              SQL
              echo "Done."
          resources:
            {{- toYaml (.Values.postgresql.populate.resources | default dict) | nindent 12 }}
{{- end }}
