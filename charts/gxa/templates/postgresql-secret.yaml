{{- if or .Values.postgresql.enabled .Values.postgresql.populate.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-postgresql
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "postgresql.superuserPassword must be set when postgresql.enabled=true (use .secrets-<env>.yaml)" .Values.postgresql.superuserPassword | quote }}
  ATLASPRD3_PASSWORD: {{ required "postgresql.atlasprd3Password must be set when postgresql.enabled=true (use .secrets-<env>.yaml)" .Values.postgresql.atlasprd3Password | quote }}
  ATLASDATALOAD_PASSWORD: {{ required "postgresql.atlasdataloadPassword must be set when postgresql.enabled=true (use .secrets-<env>.yaml)" .Values.postgresql.atlasdataloadPassword | quote }}
  {{- end }}
  {{- if .Values.postgresql.populate.enabled }}
  SOURCE_PG_PASSWORD: {{ required "postgresql.populate.source.password must be set when postgresql.populate.enabled=true (use .secrets-<env>.yaml)" .Values.postgresql.populate.source.password | quote }}
  {{- if not .Values.postgresql.enabled }}
  TARGET_PG_PASSWORD: {{ required "postgresql.populate.target.password must be set when populate.enabled=true and postgresql.enabled=false (use .secrets-<env>.yaml)" .Values.postgresql.populate.target.password | quote }}
  {{- end }}
  {{- end }}
{{- end }}
