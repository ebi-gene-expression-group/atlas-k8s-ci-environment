apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-secrets
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:

  {{- if not (empty .Values.tomcat) -}}
  {{- if .Values.tomcat.createSecret | default false -}}
  tomcat-users.xml: |
    <tomcat-users>
      <role rolename="manager-script"/>
      <user username="deployer" 
            password="{{ .Values.tomcat.deployerPassword }}" 
            roles="standard,manager-script"/>
    </tomcat-users> 
  {{- end }}
  {{- end }}

  {{- if not (empty .Values.jdbc) -}}
  {{- if .Values.jdbc.createSecret -}}
  jdbc.properties: |
    jdbc.url = {{ .Values.jdbc.url }}
    jdbc.username = atlasprd3
    jdbc.password = {{ .Values.jdbc.password }}
    jdbc.pool = gxa
  {{- end }}
  {{- end }}

  {{- if not (empty .Values.solr) -}}
  {{- if .Values.solr.createSecret -}}
  solr.properties: |
    zk.hosts = gxa-solrcloud-zookeeper-client.anmol-test:2181
    solr.hosts = http://gxa-solrcloud-common.anmol-test/solr
    # solr.user = atlas_admin
    # solr.pass = {{ .Values.solr.password }}
  {{- end }}
  {{- end }}
    


