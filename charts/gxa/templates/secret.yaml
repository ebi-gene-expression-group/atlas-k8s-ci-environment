apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-secrets
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: delete
type: Opaque
stringData:
  {{- if and (not (empty .Values.tomcat)) (.Values.tomcat.createSecret | default false) }}
  tomcat-users.xml: |
    <tomcat-users>
      <role rolename="manager-script"/>
      <user username="deployer" 
            password="{{ .Values.tomcat.deployerPassword }}" 
            roles="standard,manager-script"/>
    </tomcat-users> 
  {{- end }}

  {{- if and (not (empty .Values.jdbc)) .Values.jdbc.createSecret }}
  jdbc.properties: |
    jdbc.url = {{ .Values.jdbc.url }}
    jdbc.username = atlasprd3
    jdbc.password = {{ .Values.jdbc.password }}
    jdbc.pool = gxa
  {{- end }}

  {{- if and (not (empty .Values.solr)) .Values.solr.createSecret }}
  solr.properties: |
    zk.hosts = {{ .Values.solr.namespace }}-zookeeper-client.{{ .Values.solr.namespace }}:2181
    solr.hosts = http://{{ .Values.solr.namespace }}-common.{{ .Values.solr.namespace }}/solr
    solr.user = {{ .Values.solr.user }}
    solr.pass = {{ .Values.solr.password }}
  {{- end }}
