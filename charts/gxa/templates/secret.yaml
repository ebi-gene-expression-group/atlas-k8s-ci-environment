apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gxa.fullname" . }}-secrets
  labels:
    {{- include "gxa.labels" . | nindent 4 }}
type: Opaque
stringData:
  tomcat-users.xml: |
    <tomcat-users>
      <role rolename="manager-gui"/>
      <user username="deployer" password="{{ .Values.tomcat.deployerPassword }}" roles="manager-gui"/>
    </tomcat-users> 


