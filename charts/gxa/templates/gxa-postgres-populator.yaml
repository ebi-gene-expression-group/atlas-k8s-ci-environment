apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-postgres-populator
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  template:
    spec:
      volumes:
        - name: {{ include "app.name" . }}-expdesign-vol
          persistentVolumeClaim:
            claimName: {{ include "app.name" . }}-expdesign-rwo
        - name: services-volume
          nfs:
            server: {{ .Values.nfs.server }}
            path: /ifs/public/services
        - name: {{ include "app.name" . }}-data-vol
          emptyDir: {}
        - name: atlas-web-bulk
          emptyDir: {}
        - name: {{ include "app.name" . }}-secrets
          secret:
            secretName: {{ include "app.fullname" . }}-secrets
        - name: {{ include "app.name" . }}-codon-volume
          nfs:
            server: {{ .Values.nfs.server }}
            path: /ifs/public/ro/gxa_codon
          # persistentVolumeClaim:
            # claimName: {{ include "app.name" . }}-data-rox
        # TODO mount jdbc.proeprties secret as a file
      containers:
        - name: {{ include "app.fullname" . }}-postgres-populator
          image: openjdk:11
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Dfile.encoding=UTF8"
            - name: HTTP_PROXY
              valueFrom:
                configMapKeyRef:
                  name: ebi-proxy
                  key: HTTP_PROXY
            - name: HTTPS_PROXY
              valueFrom:
                configMapKeyRef:
                  name: ebi-proxy
                  key: HTTPS_PROXY
            - name: http_proxy
              valueFrom:
                configMapKeyRef:
                  name: ebi-proxy
                  key: HTTP_PROXY
            - name: https_proxy
              valueFrom:
                configMapKeyRef:
                  name: ebi-proxy
                  key: HTTPS_PROXY
            - name: NO_PROXY
              valueFrom:
                configMapKeyRef:
                  name: ebi-proxy
                  key: NO_PROXY
            - name: PROXY_HOST
              valueFrom:
                configMapKeyRef:
                  name: ebi-proxy
                  key: PROXY_HOST
            - name: PROXY_PORT
              valueFrom:
                configMapKeyRef:
                  name: ebi-proxy
                  key: PROXY_PORT
            - name: EXP_IDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "app.fullname" . }}-config
                  key: experiment_ids
          resources:
            requests:
              memory: "2Gi"
              cpu: "2"
              ephemeral-storage: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              git clone --recurse-submodules --depth 1 --single-branch \
                "https://github.com/ebi-gene-expression-group/atlas-web-bulk.git"
              cp /secrets/jdbc.properties /atlas-web-bulk/cli/src/main/resources/

              cd /atlas-web-bulk/

              mkdir /atlas-data/exp/magetab
              ln -s /atlas-data/services/fg/atlas/{{ .Values.nfs.snapshotComponent }}/* \
                    /atlas-data/exp/magetab 
              ls -lt /atlas-data/exp/magetab 

              ./gradlew \
              {{ include "app.jvmProxyArgs" . | indent 14 }} \
              -PexperimentFilesLocation=/atlas-data/exp \
              -PexperimentDesignLocation=/atlas-data/expdesign \
              -Dlogging.level.root=DEBUG \
              -Dlogging.level.org.springframework=DEBUG \
              ":cli:bootRun" --args="create-update-experiment -e $(echo ${EXP_IDS})"
              
              ./gradlew \
              {{ include "app.jvmProxyArgs" . | indent 14 }} \
              -PexperimentFilesLocation=/atlas-data/exp \
              -PexperimentDesignLocation=/atlas-data/expdesign \
              -Dlogging.level.root=DEBUG \
              -Dlogging.level.org.springframework=DEBUG \
              ":cli:bootRun" --args="update-experiment-design -e $(echo ${EXP_IDS})"
                            
              ./gradlew \
              {{ include "app.jvmProxyArgs" . | indent 14 }} \
              -PexperimentFilesLocation=/atlas-data/exp \
              -PexperimentDesignLocation=/atlas-data/expdesign \
              -Dlogging.level.root=DEBUG \
              -Dlogging.level.uk.ac.ebi.atlas=DEBUG \
              -Dlogging.level.org.springframework=DEBUG \
              ":cli:bootRun" --args="update-baseline-coexpression -e $(echo ${EXP_IDS})"

              sleep 5000
          volumeMounts:
            - name: {{ include "app.name" . }}-expdesign-vol
              mountPath: "/atlas-data/expdesign"
            - name: {{ include "app.name" . }}-data-vol
              mountPath: "/atlas-data/exp"
            - name: services-volume
              mountPath: /atlas-data/services
            - name: {{ include "app.name" . }}-codon-volume
              mountPath: /atlas-data/exp/{{ include "app.name" . }}-codon
            - name: {{ include "app.name" . }}-codon-volume
              mountPath: /atlas-data/exp/species-properties.json
              subPath: species-properties.json  
              readOnly: true
            - name: atlas-web-bulk
              mountPath: /atlas-web-bulk
            - name: {{ include "app.name" . }}-secrets
              mountPath: /secrets/jdbc.properties
              subPath: jdbc.properties
      restartPolicy: Never
  backoffLimit: 4
