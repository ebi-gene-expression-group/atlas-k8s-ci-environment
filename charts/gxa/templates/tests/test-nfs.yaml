{{- if .Values.nfs.server }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "app.fullname" . }}-test-nfs"
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-nfs
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: nfs-mount-probe
      image: busybox:1.36
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          fail=0
          check_dir() {
            label="$1"
            path="$2"
            echo "Checking ${label}: ${path}"
            if [ ! -d "${path}" ]; then
              echo "FAIL: ${label} is not a directory (or not mounted): ${path}" >&2
              fail=1
              return
            fi
            if ! ls "${path}" >/dev/null 2>&1; then
              echo "FAIL: ${label} exists but is not readable: ${path}" >&2
              fail=1
              return
            fi
            count="$(ls -A "${path}" 2>/dev/null | wc -l | tr -d ' ')"
            if [ "${count}" -eq 0 ]; then
              echo "FAIL: ${label} is empty: ${path}" >&2
              fail=1
              return
            fi
            echo "OK: ${label} readable (${count} entries)"
          }

          check_dir "gxa_codon NFS" "{{ include "app.dataDir" . }}/gxa_codon"
          check_dir "experiments snapshot source" "{{ include "app.experimentsSourceDir" . }}"
          check_dir "services NFS" "{{ include "app.servicesDir" . }}"
          check_dir "environment dir" "{{ include "app.servicesDir" . }}/fg/atlas/environments/{{ .Values.environment }}"
          check_dir "expdesign NFS" "{{ include "app.expdesignDir" . }}"

          if [ "${fail}" -ne 0 ]; then
            echo "FAIL: one or more NFS mounts failed" >&2
            exit 1
          fi
          echo "OK: all NFS mount checks passed"
      volumeMounts:
        - name: codon-volume
          mountPath: {{ include "app.dataDir" . }}/gxa_codon
          readOnly: true
        - name: services-volume
          mountPath: {{ include "app.servicesDir" . }}
          readOnly: true
        - name: expdesign-volume
          mountPath: {{ include "app.expdesignDir" . }}
          readOnly: true
  volumes:
    - name: codon-volume
      nfs:
        server: {{ .Values.nfs.server }}
        path: /ifs/public/ro/gxa_codon
    - name: services-volume
      nfs:
        server: {{ .Values.nfs.server }}
        path: /ifs/public/services
    - name: expdesign-volume
      nfs:
        server: {{ .Values.nfs.server }}
        path: {{ .Values.nfs.expdesignPath | default (printf "/ifs/public/services/fg/atlas/environments/%s/expdesign" .Values.environment) }}
        readOnly: true
{{- end }}
