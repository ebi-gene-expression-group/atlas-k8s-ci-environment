apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-config
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  server.xml: |
    <Server port="8005" shutdown="SHUTDOWN">
      <GlobalNamingResources>
        <Resource name="UserDatabase" auth="Container"
                  type="org.apache.catalina.UserDatabase"
                  description="User database that can be updated and saved"
                  factory="org.apache.catalina.users.MemoryUserDatabaseFactory"
                  pathname="conf/tomcat-users.xml"/>
      </GlobalNamingResources>
      <Service name="Catalina">
        <Connector port="{{ .Values.tomcat.httpPort }}" 
                    protocol="HTTP/1.1"
                    connectionTimeout="20000"
                    redirectPort="8443"/>
        <Engine name="Catalina" defaultHost="localhost">
          <Realm className="org.apache.catalina.realm.UserDatabaseRealm"
                  resourceName="UserDatabase"/>
          <Host name="localhost" appBase="webapps"
                unpackWARs="true" autoDeploy="true">
            <Valve className="org.apache.catalina.valves.RemoteIpValve"/>
            <Valve className="org.apache.catalina.valves.AccessLogValve"
                    directory="logs"
                    prefix="access_log"
                    suffix=".log"
                    pattern="%h %l %u %t %m %U %q %s %b %D"
                    resolveHosts="false"/>
          </Host>
        </Engine>
    </Service>
    </Server> 

  # Manager webapp context (allows external connections for testing)
  manager-context.xml: |
    <Context antiResourceLocking="false" privileged="true">
      <CookieProcessor className="org.apache.tomcat.util.http.Rfc6265CookieProcessor"
                       sameSiteCookies="strict"/>
      <Manager 
              sessionAttributeValueClassNameFilter="java\.lang\.(?:Boolean|Integer|Long|Number|String)|org\.apache\.catalina\.filters\.CsrfPreventionFilter\$LruCache(?:\$1)?|java\.util\.(?:Linked)?HashMap"/>
      <!-- Allow connections from localhost and Kubernetes cluster IPs -->
      <Valve className="org.apache.catalina.valves.RemoteAddrValve"
             allow="127\.\d+\.\d+\.\d+|::1|0:0:0:0:0:0:0:1|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2[0-9]|3[0-1])\.\d+\.\d+|192\.168\.\d+\.\d+"/>
    </Context>

  configuration.properties: |
    data.files.location = {{- include "app.dataDir" . }}
    experiment.files.location = {{- include "app.experimentsDir" . }}
    experiment.design.location= {{ include "app.expdesignDir" . }}


  {{- if .Values.nginx.enabled }}
  nginx.conf: |
    {{- if and .Values.nginx.cache.enabled .Values.nginx.cache.purge.enabled }}
    load_module modules/ngx_http_cache_purge_module.so;
    {{- end }}
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent $request_time $upstream_cache_status "$http_referer" "$http_user_agent"';
      access_log /dev/stdout main;
      sendfile on;
      keepalive_timeout 65;
      {{- if .Values.nginx.cache.enabled }}
      proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=atlas:{{ .Values.nginx.cache.zoneSize }} max_size={{ .Values.nginx.cache.maxSize }} inactive={{ .Values.nginx.cache.inactive }};
      proxy_temp_path /var/cache/nginx/proxy_temp;
      {{- end }}
      server {
        listen 8081;
        client_max_body_size {{ .Values.nginx.clientMaxBodySize | default "1m" }};
        location = {{ .Values.nginx.contextPath }}/json/health {
          proxy_pass http://127.0.0.1:{{ .Values.tomcat.httpPort }};
          proxy_http_version 1.1;
          proxy_connect_timeout {{ .Values.nginx.proxyConnectTimeout }};
          proxy_send_timeout {{ .Values.nginx.proxySendTimeout }};
          proxy_read_timeout {{ .Values.nginx.proxyReadTimeout }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_cache off;
          proxy_no_cache 1;
          add_header X-Cache-Status $upstream_cache_status;
        }
        {{- if eq (include "app.nginx.purgeOpsAuthEnabled" .) "true" }}
        {{- include "app.nginx.cachePurgeOpsLocations" . | nindent 8 }}
        {{- end }}
        location / {
          proxy_pass http://127.0.0.1:{{ .Values.tomcat.httpPort }};
          proxy_http_version 1.1;
          proxy_connect_timeout {{ .Values.nginx.proxyConnectTimeout }};
          proxy_send_timeout {{ .Values.nginx.proxySendTimeout }};
          proxy_read_timeout {{ .Values.nginx.proxyReadTimeout }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          {{- if .Values.nginx.cache.enabled }}
          proxy_cache atlas;
          proxy_cache_key "$uri$is_args$args";
          proxy_cache_valid 200 {{ .Values.nginx.cache.valid200 }};
          proxy_cache_use_stale error timeout updating;
          proxy_cache_methods GET HEAD;
          {{- if and .Values.nginx.cache.purge.enabled (not .Values.nginx.cache.purge.opsAuth.enabled) }}
          proxy_cache_purge PURGE{{ if .Values.nginx.cache.purge.allowPurgeAll }} purge_all{{ end }} from {{ join " " .Values.nginx.cache.purge.allow }};
          {{- end }}
          add_header X-Cache-Status $upstream_cache_status;
          {{- end }}
        }
      }
    }
  {{- end }}

  logback.xml: |
    <configuration>
      <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
        <encoder>
          <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n</pattern>
        </encoder>
      </appender>
      <root level="INFO">
        <appender-ref ref="STDOUT" />
      </root>
      <logger name="uk.ac.ebi.atlas" level="DEBUG" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <logger name="org.springframework.web" level="DEBUG" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <logger name="org.springframework.jdbc" level="DEBUG" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
    </configuration>


