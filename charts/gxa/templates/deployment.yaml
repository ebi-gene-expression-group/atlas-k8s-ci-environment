apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: webapp
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webapp
    spec:
      {{- if or .Values.imagePullSecret.create (not (empty .Values.imagePullSecret.name)) (not (empty .Values.imagePullSecrets)) }}
      imagePullSecrets:
        {{- if or .Values.imagePullSecret.create (not (empty .Values.imagePullSecret.name)) }}
        - name: {{ include "app.registryPullSecretName" . | quote }}
        {{- end }}
        {{- range .Values.imagePullSecrets }}
        - name: {{ .name | quote }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "app.name" . }}-webapp
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.tomcat.debug.enabled }}
          command: [ "catalina.sh" ]
          args: [ "jpda", "run" ]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.tomcat.httpPort }}
              protocol: TCP
            {{- if .Values.tomcat.debug.enabled }}
            - name: debug
              containerPort: {{ .Values.tomcat.debug.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /gxa/json/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 20
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /gxa/json/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # readinessProbe:
          #   httpGet:
          #     path: /gxa/json/experiments
          #     port: http
          #   periodSeconds: 30
          #   timeoutSeconds: 300
          #   failureThreshold: 1
          env:
            # From Secret (sensitive credentials)
            - name: SOLR_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.fullname" . }}-secrets
                  key: SOLR_USER
            - name: SOLR_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.fullname" . }}-secrets
                  key: SOLR_PASS
            {{- include "app.proxyEnv" . | nindent 12 }}
            {{- /* These properties are required so that the bioentities SolrClient create
             in the SolrConfig class is authenticated */}}    
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Dfile.encoding=UTF8
                -Dsolr.httpclient.builder.factory=org.apache.solr.client.solrj.impl.PreemptiveBasicAuthClientBuilderFactory
                -Dbasicauth=$(SOLR_USER):$(SOLR_PASS)
            {{- if .Values.tomcat.debug.enabled }}
            - name: JPDA_ADDRESS
              value: {{ .Values.tomcat.debug.address | quote }}
            {{- end }}
            - name: CATALINA_OPTS
              value: >-
                -Dhttp.proxyHost=${PROXY_HOST}
                -Dhttp.proxyPort=${PROXY_PORT}
                -Dhttps.proxyHost=${PROXY_HOST}
                -Dhttps.proxyPort=${PROXY_PORT}
                -Dhttp.nonProxyHosts=${NO_PROXY//,/|}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- /* app data mounts */}}
            - name: experiments-snapshot
              mountPath: {{ include "app.experimentsDir" . }}/magetab
              readOnly: true
            - name: admin-volume
              mountPath: {{ include "app.experimentsDir" . }}/admin
            - name: codon-volume
              mountPath: {{ include "app.dataDir" . }}/gxa_codon
              readOnly: true
            - name: codon-volume
              mountPath: {{ include "app.experimentsDir" . }}/release-metadata.json
              subPath: release-metadata.json
              readOnly: true
            - name: codon-volume
              mountPath: {{ include "app.experimentsDir" . }}/species-properties.json
              subPath: species-properties.json
              readOnly: true
            - name: services-volume
              mountPath: {{ include "app.dataDir" . }}/bioentity_properties
              subPath: fg/atlas/bioentity_properties/gxa
              readOnly: true
            - name: expdesign-volume
              mountPath: {{ include "app.expdesignDir" . }}
            - name: services-volume
              mountPath: {{ include "app.servicesDir" . }}
            - name: services-volume
              mountPath: {{ include "app.dataDir" . }}/ontology
              subPath: fg/atlas/ontology
              readOnly: true
            - name: services-volume
              mountPath: /nfs/public/services/fg/atlas
              subPath: fg/atlas
              readOnly: true
            {{- /* webapp properties mounts */}}
            - name: configuration-properties
              mountPath: /webapp-properties/configuration.properties
              subPath: configuration.properties
            - name: tomcat-logback-xml
              mountPath: /webapp-properties/logback.xml
              subPath: logback.xml
            - name: {{ include "app.name" . }}-secrets
              mountPath: /webapp-properties/jdbc.properties
              subPath: jdbc.properties
            - name: {{ include "app.name" . }}-secrets
              mountPath: /webapp-properties/solr.properties
              subPath: solr.properties
            {{- /* tomcat config mounts */}}
            - name: {{ include "app.name" . }}-secrets
              mountPath: {{ include "app.tomcatDir" . }}/conf/tomcat-users.xml
              subPath: tomcat-users.xml
            - name: tomcat-logs
              mountPath: {{ include "app.tomcatDir" . }}/logs
            - name: tomcat-work
              mountPath: {{ include "app.tomcatDir" . }}/work
            # Mount managed manager context.xml into the manager webapp
            - name: tomcat-server-config
              mountPath: {{ include "app.tomcatDir" . }}/webapps/manager/META-INF/context.xml
              subPath: manager-context.xml
            - name: tomcat-server-config
              mountPath: {{ include "app.tomcatDir" . }}/conf/server.xml
              subPath: server.xml
            - name: tomcat-config
              mountPath: {{ include "app.tomcatDir" . }}/conf/Catalina
        {{- if .Values.nginx.enabled }}
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: nginx
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: codon-volume
          nfs:
            server: {{ .Values.nfs.server }}
            path: /ifs/public/ro/gxa_codon
        - name: services-volume
          nfs:
            server: {{ .Values.nfs.server }}
            path: /ifs/public/services
        - name: expdesign-volume
          nfs:
            server: {{ .Values.nfs.server }}
            {{- /* Override with nfs.expdesignPath when env dir name differs (e.g. public has expdesigns). */}}
            path: {{ .Values.nfs.expdesignPath | default (printf "/ifs/public/services/fg/atlas/environments/%s/expdesign" .Values.environment) }}
            readOnly: true
        - name: experiments-snapshot
          emptyDir: {}
        - name: admin-volume
          emptyDir: {}
        - name: configuration-properties
          configMap:
            name: {{ include "app.fullname" . }}-config
            items:
              - key: configuration.properties
                path: configuration.properties
        - name: tomcat-server-config
          configMap:
            name: {{ include "app.fullname" . }}-config
            items:
              - key: server.xml
                path: server.xml
              - key: manager-context.xml
                path: manager-context.xml
        - name: tomcat-logback-xml
          configMap:
            name: {{ include "app.fullname" . }}-config
            items:
              - key: logback.xml
                path: logback.xml
        {{- include "app.secretsVolume" . | nindent 8 }}
        # TODO: do we need to make logs a persistent volume? If we use the cluster's monitoring, there is no need.
        - name: tomcat-logs
          persistentVolumeClaim:
            claimName: tomcat-logs
        - name: tomcat-work
          emptyDir: {}
        - name: tomcat-config
          emptyDir: {}
        {{- if .Values.nginx.enabled }}
        - name: nginx-config
          configMap:
            name: {{ include "app.fullname" . }}-config
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: nginx-cache
          persistentVolumeClaim:
            claimName: nginx-cache
        {{- end }}
      initContainers:
        - name: "init-experiments-snapshot"
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: busybox
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh"]
          args:
            - "-c"
            - |
              set -vx
              echo environment dir content: $(ls -l {{ include "app.servicesDir" . }}/fg/atlas/environments/{{- .Values.environment -}})
              echo "Experiments source dir: {{ include "app.experimentsSourceDir" . }}" 
              EXPERIMENTS_SOURCE_DIR="{{- include "app.experimentsSourceDir" . -}}"
              if [ ! -d "$EXPERIMENTS_SOURCE_DIR" ]; then
                echo "ERROR: experimentsSourceDir does not exist: $EXPERIMENTS_SOURCE_DIR" >&2
                exit 1
              fi
              echo "experimentsSourceDir exists: $EXPERIMENTS_SOURCE_DIR"
              ln -s "$EXPERIMENTS_SOURCE_DIR"/E-* /experiments_snapshot
              echo "Number of experiments in snapshot: $(ls /experiments_snapshot | wc -l)"
          volumeMounts:
            - name: codon-volume
              mountPath: {{ include "app.dataDir" . }}/gxa_codon
            - name: services-volume
              mountPath: {{ include "app.servicesDir" . }}
            - name: experiments-snapshot
              mountPath: /experiments_snapshot
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
