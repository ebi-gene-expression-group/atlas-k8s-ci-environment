# Default values for gxa.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: dockerhub.ebi.ac.uk/davidg/atlas-web-bulk
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "c043a5c5" 

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: 
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  runAsUser: 2921
  runAsGroup: 1146
  # fsGroup: 1146

service:
  type: NodePort
  port: 80
  nodePort: 32000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

tomcat:
  httpPort: 8080
  webapps:
    volume:
      size: 10Gi 
      storageClassName: standard-nfs-production
  deployerPassword:
nfs:
  server: hh-isi-srv-vlan1496.ebi.ac.uk
  snapshotComponent: gxa_codon_2025-07-14_14:10

secrets:
  jdbc:
    username:
    password:
  solr:
    username:
    password:

data:
  files:
    location: /srv/gxa/data
experiment:
  files:
    location: /srv/gxa/data/gxa
  design:
    location: /srv/gxa/data/gxa/expdesign/

jdbc:
  url: jdbc:postgresql://pgsql-dlvm-078.ebi.ac.uk:5432/gxpatlastst