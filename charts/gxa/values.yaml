# Default values for gxa.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: tomcat
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "8-jdk11"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Optional: registry credentials applied to all Pods using this SA
  imagePullSecrets: []

# Optional docker registry secret managed by this chart
registrySecret:
  create: false
  # If empty and create=true, defaults to "{{ include \"app.fullname\" . }}-registry"
  # name: ""
  # Provide the full Docker config JSON content for the key ".dockerconfigjson".
  # TIP: Populate this via CI secrets; do not commit real credentials to Git.
  # Example content (abbreviated):
  # {
  #   "auths": {
  #     "ghcr.io": {"auth": "<base64(user:token)>"}
  #   }
  # }
  # dockerconfigjson: ""

podAnnotations: {}

# fg_atlas/
podSecurityContext:
  runAsUser: 2921
  runAsGroup: 1146

service:
  type: NodePort
  port: 80

resources:
  requests:
    memory: "4Gi"
    cpu: "1"
  limits:
    memory: "6Gi"
    cpu: "1.5"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  
nodeSelector: {}

tolerations: []

affinity: {}

tomcat:
  httpPort: 8080
  # deployerPassword: set-in-commandline
  # curatorPassword: set-in-commandline
  # createSecret: false
  # Enable JPDA debugging (Java Platform Debugger Architecture)
  # When enabled, Tomcat will start with debug port 8000 exposed
  debug:
    enabled: false
    port: 8000
    address: "*:8000"  # Use "*:8000" to listen on all interfaces, or "localhost:8000" for localhost only

loggingLevel: DEBUG

nfs:
  server: "hh-isi-srv-vlan1496.ebi.ac.uk"
  snapshotComponent: "experiments"
