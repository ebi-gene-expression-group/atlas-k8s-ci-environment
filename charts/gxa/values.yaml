# Default values for gxa.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: dockerhub.ebi.ac.uk/ebi-gene-expression/atlas-web-bulk/gxa
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 

# Extra pull secrets (by name) in addition to any secret created from imagePullSecret below.
imagePullSecrets: []
#  - name: other-registry

# Create a Secret of type kubernetes.io/dockerconfigjson for the container registry.
# No ServiceAccount required — credentials are on the pod via imagePullSecrets.
# Set create: true and pass username plus password (use helm -f with a secrets file, or
# .secrets file gitignored, not plain values in git).
# Or leave create: false and only use imagePullSecrets with a pre-created secret.
imagePullSecret:
  create: false
  # Kubernetes Secret name (default: <release-name>-fg-search-registry)
  server: dockerhub.ebi.ac.uk
  name: gxa-registry
  username: 
  password: 


nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Optional: registry credentials applied to all Pods using this SA
  imagePullSecrets: []

# Optional docker registry secret managed by this chart
registrySecret:
  create: false
  # If empty and create=true, defaults to "{{ include \"app.fullname\" . }}-registry"
  # name: ""
  # Provide the full Docker config JSON content for the key ".dockerconfigjson".
  # TIP: Populate this via CI secrets; do not commit real credentials to Git.
  # Example content (abbreviated):
  # {
  #   "auths": {
  #     "ghcr.io": {"auth": "<base64(user:token)>"}
  #   }
  # }
  # dockerconfigjson: ""

podAnnotations: {}

# fg_atlas/
podSecurityContext:
  runAsUser: 2921
  runAsGroup: 1146

service:
  type: NodePort
  port: 80

# Path-based routing (e.g. shared host /gxa/...). Requires an ingress controller
# that honors the default nginx rewrite annotations (strip path prefix before the pod).
ingress:
  enabled: true
  className: nginx
  annotations: {}
    # nginx.ingress.kubernetes.io/use-regex: "true"
    # nginx.ingress.kubernetes.io/rewrite-target: /$2
  pathPrefix: /gxa
  # Ingress path rule is built from pathPrefix (regex + rewrite-target). Add host if you need a name-based vhost.
  hosts:
    - host: ""
  tls: []
  # Proxy cache at the ingress controller (requires http-snippet on ingress-nginx ConfigMap — see NOTES after install).
  # When enabled, prefer nginx.cache.enabled: false on the sidecar to avoid double caching.
  cache:
    enabled: false
    zoneName: gxa_cache
    zoneSize: 10m
    maxSize: 1g
    inactive: 60d
    valid200: 60d
    proxyReadTimeout: "600"
    proxySendTimeout: "600"
    # Disk path on ingress controller pods (used in http-snippet below)
    controllerCachePath: /tmp/gxa-nginx-cache
# Override URL prefix for the app when ingress is off but traffic is still under a path.
publicUrlPrefix: ""

resources:
  requests:
    memory: "4Gi"
    cpu: "1"
  limits:
    memory: "6Gi"
    cpu: "1.5"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  
nodeSelector: {}

tolerations: []

affinity: {}

# Nginx reverse proxy sidecar (gradual rollout - disabled by default)
nginx:
  enabled: true
  # App context path (e.g. /gxa for GXA) - used for cache bypass paths
  contextPath: /gxa
  image:
    repository: dockerhub.ebi.ac.uk/ebi-gene-expression/atlas-web-bulk/nginx
    tag: 1.29.5-alpine
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  # Proxy timeouts (for slow upstream requests)
  proxyReadTimeout: 600s
  proxySendTimeout: 600s
  proxyConnectTimeout: 10s
  # Max request body size (for Tomcat Manager WAR uploads; default 1m is too small)
  clientMaxBodySize: 140m
  # Proxy cache settings (when enabled)
  cache:
    enabled: true
    zoneSize: 10m
    maxSize: 1g
    inactive: 7d
    valid200: 60d
    # Persistent cache across pod restarts
    storageSize: 2Gi
    storageClassName: standard-nfs-production
    accessMode: ReadWriteMany

tomcat:
  httpPort: 8080
  # deployerPassword: set-in-commandline
  # curatorPassword: set-in-commandline
  # createSecret: false
  # Enable JPDA debugging (Java Platform Debugger Architecture)
  # When enabled, Tomcat will start with debug port 8000 exposed
  debug:
    enabled: false
    port: 8000
    address: "*:8000"  # Use "*:8000" to listen on all interfaces, or "localhost:8000" for localhost only

loggingLevel: DEBUG

nfs:
  server: "hh-isi-srv-vlan1496.ebi.ac.uk"
  snapshotComponent: "experiments"
