# Default values for gxa.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: tomcat
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "8-jdk11"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Optional: registry credentials applied to all Pods using this SA
  imagePullSecrets: []

# Optional docker registry secret managed by this chart
registrySecret:
  create: false
  # If empty and create=true, defaults to "{{ include \"app.fullname\" . }}-registry"
  # name: ""
  # Provide the full Docker config JSON content for the key ".dockerconfigjson".
  # TIP: Populate this via CI secrets; do not commit real credentials to Git.
  # Example content (abbreviated):
  # {
  #   "auths": {
  #     "ghcr.io": {"auth": "<base64(user:token)>"}
  #   }
  # }
  # dockerconfigjson: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: 
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  runAsUser: 2921
  runAsGroup: 1146

service:
  type: NodePort
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

tomcat:
  httpPort: 8080
  # deployerPassword: set-in-commandline
  # createSecret: false

loggingLevel: DEBUG

jdbc:
  # populator:
  #   run: false

solr:
