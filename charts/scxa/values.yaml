# Default values for scxa.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: tomcat
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "8-jdk11"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

registrySecret:
  create: false
  # If empty and create=true, defaults to "{{ include \"app.fullname\" . }}-registry"
  # name: ""
  # Provide the full Docker config JSON content for the key ".dockerconfigjson".
  # TIP: Populate this via CI secrets; do not commit real credentials to Git.
  # Example content (abbreviated):
  # {
  #   "auths": {
  #     "ghcr.io": {"auth": "<base64(user:token)>"}
  #   }
  # }
  dockerconfigjson: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    memory: "3.5Gi"
    cpu: "1200m"
  limits:
    memory: "5Gi"
    cpu: "1600m"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

tomcat:
  httpPort: 8080
  createSecret: true
  debug:
    enabled: false
    port: 8000
    address: "*:8000"  # Use "*:8000" to listen on all interfaces, or "localhost:8000" for localhost only

solr:
  namespace: scxa-dev-solrcloud
  user: admin
  numShards: "4"
  timeout: "30000"
  createSecret: true

jdbc:
  createSecret: true
  username: atlasprd3

nfs:
  server: hh-isi-srv-vlan1496.ebi.ac.uk
