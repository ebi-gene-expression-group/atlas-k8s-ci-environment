# Default values for scxa.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: tomcat
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "8-jdk11"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

registrySecret:
  create: false
  # If empty and create=true, defaults to "{{ include \"app.fullname\" . }}-registry"
  # name: ""
  # Provide the full Docker config JSON content for the key ".dockerconfigjson".
  # TIP: Populate this via CI secrets; do not commit real credentials to Git.
  # Example content (abbreviated):
  # {
  #   "auths": {
  #     "ghcr.io": {"auth": "<base64(user:token)>"}
  #   }
  # }
  dockerconfigjson: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    memory: "3.5Gi"
    cpu: "1400m"
  limits:
    memory: "5Gi"
    cpu: "1700m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Nginx reverse proxy sidecar (gradual rollout - disabled by default)
nginx:
  enabled: true
  # App context path (e.g. /gxa/sc for SCXA, /gxa for GXA) - used for cache bypass paths
  contextPath: /gxa/sc
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  # Proxy timeouts (for slow upstream requests - e.g. /gxa/sc/json/experiments, /gxa/sc/experiments/.../results)
  proxyReadTimeout: 600s
  proxySendTimeout: 600s
  proxyConnectTimeout: 10s
  # Max request body size (for Tomcat Manager WAR uploads; default 1m is too small)
  clientMaxBodySize: 140m
  # Proxy cache settings (when enabled)
  cache:
    enabled: true
    zoneSize: 10m
    maxSize: 1g
    inactive: 60d
    valid200: 60d
    # Persistent cache across pod restarts
    storageSize: 2Gi
    storageClassName: standard-nfs-production
    accessMode: ReadWriteMany

tomcat:
  heapSize:
    start: "1g"
    max: "3g"
  httpPort: 8080
  createSecret: true
  debug:
    enabled: false
    port: 8000
    address: "*:8000"  # Use "*:8000" to listen on all interfaces, or "localhost:8000" for localhost only

solr:
  namespace: scxa-dev-solrcloud
  user: admin
  numShards: "4"
  timeout: "30000"
  createSecret: true

jdbc:
  createSecret: true
  username: atlasprd3

nfs:
  server: hh-isi-srv-vlan1496.ebi.ac.uk
