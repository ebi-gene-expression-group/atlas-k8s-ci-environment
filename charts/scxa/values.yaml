# Default values for scxa.

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

tomcat:
  httpPort: 8080

solr:
  namespace: set-per-env
  numShards: "4"
  timeout: "30000"
  scxaAnalytics:
    collection: scxa-analytics
  bioentities:
    collection: bioentities
  scxagene2experiment:
    collection: gene2experiment

podAnnotations: {}
podSecurityContext: {}

securityContext: {}

image:
  repository: tomcat
  pullPolicy: IfNotPresent
  tag: "8-jdk11"
imagePullSecrets: []

resources: {}

serviceAccount:
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  annotations: {}
  # Optional: registry credentials applied to all Pods using this SA
  imagePullSecrets: [ ]
